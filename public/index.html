<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IONECENTER - Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --ione-red: #E31E24;
            --bg-dark: #0a0a0f;
            --glass-bg: rgba(15, 15, 25, 0.45);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text: #ffffff;
            --text-muted: #a1a1aa;
            --accent: #a855f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            direction: ltr; 
            position: relative;
        }

        /* 🌌 الخلفية المتحركة (الكون) */
        .universe-bg {
            position: absolute;
            top: -5%; left: -5%; width: 110%; height: 110%;
            background-image: url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            z-index: -2;
            animation: panUniverse 25s infinite alternate ease-in-out;
        }

        @keyframes panUniverse {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(-2%, 2%); }
        }

        /* طبقة تعتيم فوق الكون */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        /* الحاوية الرئيسية */
        .main-container {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 100vh;
            padding: 0 6vw;
        }

        /* =========================================================
           🟢 اليسار: النماذج
        ========================================================= */
        .auth-container {
            width: 100%;
            max-width: 520px;
            opacity: 0;
            animation: slideInLeft 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes slideInLeft {
            0% { opacity: 0; transform: translateX(-150px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .auth-box {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 50px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
        }

        /* التبويبات */
        .tabs { display: flex; margin-bottom: 30px; border-bottom: 1px solid var(--glass-border); }

        .tab {
            flex: 1;
            text-align: center;
            padding: 15px;
            cursor: pointer;
            color: var(--text-muted);
            font-weight: 700;
            transition: 0.3s;
            position: relative;
            font-size: 1.1rem;
        }

        .tab.active { color: white; }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent);
            box-shadow: 0 -2px 15px var(--accent);
        }

        /* النماذج */
        .form-content { display: none; }
        .form-content.active { display: block; animation: fadeInForm 0.4s ease; }
        @keyframes fadeInForm { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 20px; position: relative; }

        .form-group label { display: block; font-size: 0.95rem; color: var(--text-muted); margin-bottom: 8px; text-align: left;}

        .form-group input {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px 18px;
            color: white;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: 0.3s;
            font-size: 1.05rem;
        }

        .form-group input:focus { border-color: var(--accent); background: rgba(0,0,0,0.7); }

        .form-group .icon { position: absolute; right: 18px; top: 42px; color: var(--text-muted); width: 22px; height: 22px; }

        .btn-submit {
            width: 100%;
            background: var(--ione-red);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 18px;
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
            box-shadow: 0 6px 20px rgba(227, 30, 36, 0.5);
        }

        .btn-submit:hover { background: #c4181d; transform: translateY(-2px); }

        /* =========================================================
           🌌 اليمين: الكون + العداد
        ========================================================= */
        .right-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 650px;
            opacity: 0;
            animation: slideInRight 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes slideInRight {
            0% { opacity: 0; transform: translateX(150px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .right-container h2 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 40px;
            color: #fff;
            text-shadow: 0 4px 25px rgba(0,0,0,0.9);
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0;
            animation: slideDown 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            animation-delay: 0.3s;
        }

        @keyframes slideDown {
            0% { opacity: 0; transform: translateY(-80px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 60px;
            direction: ltr;
            opacity: 0;
            animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            animation-delay: 0.5s;
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(80px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .time-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-number {
            font-family: 'Inter', sans-serif;
            font-size: 6.5rem;
            font-weight: 300;
            line-height: 1;
            text-shadow: 0 6px 30px rgba(0,0,0,0.9);
            color: #fff;
        }

        .time-label {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 5px;
            margin-top: 10px;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .separator {
            font-family: 'Inter', sans-serif;
            font-size: 6rem;
            font-weight: 300;
            line-height: 1;
            margin-top: -5px;
            color: rgba(255, 255, 255, 0.6);
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .logo-box {
            opacity: 0;
            animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            animation-delay: 0.7s;
        }

        .logo-box img {
            height: 180px;
            filter: drop-shadow(0 0 40px rgba(255,255,255,0.4));
            transition: transform 0.3s ease;
        }
        .logo-box img:hover {
            transform: scale(1.05);
        }

        /* Toast Notification */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
        .toast {
            background: rgba(15, 15, 25, 0.95); color: white; padding: 16px 28px; border-radius: 10px; font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 12px; border-left: 5px solid var(--accent); box-shadow: 0 10px 40px rgba(0,0,0,0.7); animation: slideInToast 0.3s ease forwards; margin-top: 10px; backdrop-filter: blur(10px);
        }
        @keyframes slideInToast { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Responsive */
        @media (max-width: 1100px) {
            .main-container { flex-direction: column; justify-content: center; overflow-y: auto; padding: 40px 20px; gap: 60px; }
            .universe-bg { animation: panUniverseMobile 25s infinite alternate ease-in-out; }
            .time-number { font-size: 4rem; }
            .separator { font-size: 3.5rem; }
            .logo-box img { height: 120px; }
            .right-container h2 { font-size: 2.5rem; }
        }
        @keyframes panUniverseMobile {
            0% { transform: scale(1) translateY(0); }
            100% { transform: scale(1.1) translateY(-2%); }
        }
    </style>
</head>
<body>

    <!-- خلفية الكون المتحركة -->
    <div class="universe-bg"></div>
    <div class="overlay"></div>

    <div id="toast-container"></div>

    <div class="main-container">
        
        <!-- 🟢 اليسار: النماذج -->
        <div class="auth-container">
            <div class="auth-box">
                
                <!-- تم حذف Quick Access من هنا -->

                <!-- التبويبات -->
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('login')">Sign In</div>
                    <div class="tab" onclick="switchTab('register')">Sign Up</div>
                </div>

                <!-- نموذج تسجيل الدخول -->
                <div id="login-form" class="form-content active">
                    <!-- استبدل action أدناه برابط API الحقيقي لاحقاً -->
                    <form onsubmit="event.preventDefault(); showToast('Logged in successfully (Demo)', 'success');">
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" placeholder="name@company.com" required>
                            <i data-lucide="mail" class="icon"></i>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" placeholder="••••••••" required>
                            <i data-lucide="lock" class="icon"></i>
                        </div>
                        <button type="submit" class="btn-submit">Sign In</button>
                    </form>
                </div>

                <!-- نموذج إنشاء حساب -->
                <div id="register-form" class="form-content">
                    <form onsubmit="event.preventDefault(); showToast('Account created successfully (Demo)', 'success');">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" placeholder="John Doe" required>
                            <i data-lucide="user" class="icon"></i>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" placeholder="name@company.com" required>
                            <i data-lucide="mail" class="icon"></i>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" placeholder="••••••••" required>
                            <i data-lucide="lock" class="icon"></i>
                        </div>
                        <button type="submit" class="btn-submit" style="background: var(--accent); box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);">Create Account</button>
                    </form>
                </div>

            </div>
        </div>

        <!-- 🌌 اليمين: الكون + العداد -->
        <div class="right-container">
            <h2>Coming Soon</h2>
            
            <!-- ⏳ العد التنازلي -->
            <div class="countdown-container">
                <div class="time-block">
                    <span class="time-number" id="days">00</span>
                    <span class="time-label">DAYS</span>
                </div>
                <div class="separator">:</div>
                
                <div class="time-block">
                    <span class="time-number" id="hours">00</span>
                    <span class="time-label">HOURS</span>
                </div>
                <div class="separator">:</div>
                
                <div class="time-block">
                    <span class="time-number" id="minutes">00</span>
                    <span class="time-label">MINS</span>
                </div>
                <div class="separator">:</div>
                
                <div class="time-block">
                    <span class="time-number" id="seconds">00</span>
                    <span class="time-label">SECS</span>
                </div>
            </div>

            <!-- الشعار -->
            <div class="logo-box">
                <img src="assets/logo.png" alt="IONECENTER">
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-content').forEach(f => f.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }
        }

        // تم حذف دالة checkQuickAccess لأن الصندوق لم يعد موجوداً

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            if (type === 'error') toast.style.borderLeftColor = '#ef4444';
            if (type === 'success') toast.style.borderLeftColor = '#10b981';
            
            let icon = type === 'success' ? 'check-circle' : (type === 'error' ? 'alert-circle' : 'info');
            toast.innerHTML = `<i data-lucide="${icon}"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons();
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = '0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ⏳ إعداد العد التنازلي
        const countdownDate = new Date();
        countdownDate.setDate(countdownDate.getDate() + 15);
        countdownDate.setHours(countdownDate.getHours() + 6);

        setInterval(() => {
            const now = new Date().getTime();
            const distance = countdownDate - now;

            if (distance < 0) return;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            const pad = (num) => String(num).padStart(2, '0');

            document.getElementById("days").innerText = pad(days);
            document.getElementById("hours").innerText = pad(hours);
            document.getElementById("minutes").innerText = pad(minutes);
            document.getElementById("seconds").innerText = pad(seconds);
        }, 1000);
    </script>
</body>
</html>
