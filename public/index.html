<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IONE CENTER — نظام وسيط الخدمات الذكي. قادم قريباً.">
    <meta name="theme-color" content="#E31E24">
    
    <title>IONE CENTER — Coming Soon</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/logo.png">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Background Blobs (Animated) -->
    <div class="blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Main Content -->
    <main class="container">
        
        <!-- Logo with Pulse -->
        <div class="logo-wrapper">
            <img src="assets/logo.png" alt="IONE CENTER" class="logo">
            <div class="logo-pulse"></div>
        </div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Coming Soon Text -->
        <h1 class="title">Coming Soon</h1>
        <p class="subtitle">نظام وسيط الخدمات الذكي قادم قريباً</p>
        <p class="subtitle-en">The smart service intermediary system is coming soon</p>

        <!-- Countdown Timer -->
        <div class="countdown" id="countdown">
            <div class="countdown-item">
                <span class="countdown-number" id="days">30</span>
                <span class="countdown-label">يوم</span>
            </div>
            <div class="countdown-separator">:</div>
            <div class="countdown-item">
                <span class="countdown-number" id="hours">12</span>
                <span class="countdown-label">ساعة</span>
            </div>
            <div class="countdown-separator">:</div>
            <div class="countdown-item">
                <span class="countdown-number" id="minutes">45</span>
                <span class="countdown-label">دقيقة</span>
            </div>
            <div class="countdown-separator">:</div>
            <div class="countdown-item">
                <span class="countdown-number" id="seconds">22</span>
                <span class="countdown-label">ثانية</span>
            </div>
        </div>

        <!-- Email Subscription Form -->
        <form class="subscribe-form" id="subscribeForm">
            <div class="input-group">
                <i data-lucide="mail" class="input-icon"></i>
                <input 
                    type="email" 
                    id="emailInput" 
                    placeholder="أدخل بريدك الإلكتروني" 
                    required
                >
                <button type="submit" class="subscribe-btn">
                    <i data-lucide="send" class="btn-icon"></i>
                    <span>اشترك</span>
                </button>
            </div>
            <p class="form-message" id="formMessage"></p>
        </form>

        <!-- Contact Info -->
        <div class="contact-info">
            <a href="mailto:info@ionecenter.com" class="contact-link">
                <i data-lucide="mail"></i>
                <span>info@ionecenter.com</span>
            </a>
        </div>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 IONE CENTER — All rights reserved</p>
    </footer>

    <!-- Scripts -->
    <script src="countdown.js"></script>
    <script src="app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
