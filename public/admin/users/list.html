<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IONECENTER — إدارة المستخدمين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        :root {
            --bg-body: #0b0c10; --bg-surface: rgba(18, 20, 28, 0.7); --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc; --text-muted: #94a3b8; --accent-primary: #8b5cf6; --accent-cyan: #06b6d4;
            --accent-green: #10b981; --accent-red: #ef4444; --notes-width: 340px; --sidebar-width: 380px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-body); background-image: radial-gradient(circle at center, #151b29 0%, #0b0c10 100%); color: var(--text-main); height: 100vh; overflow: hidden; user-select: none; }
        
        /* --- الهيدر العلوي --- */
        .top-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: rgba(10, 11, 15, 0.95); border-bottom: 1px solid var(--glass-border); z-index: 10; position: relative; }
        .user-profile-header { display: flex; align-items: center; gap: 12px; background: rgba(255, 255, 255, 0.03); padding: 6px 16px 6px 6px; border-radius: 50px; border: 1px solid var(--glass-border); cursor: pointer; transition: 0.3s; text-decoration: none; color: #fff; }
        .user-profile-header:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }
        .user-avatar-header { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-primary); box-shadow: 0 0 10px rgba(139, 92, 246, 0.4); }
        .user-info-header { display: flex; flex-direction: column; align-items: flex-start; }
        .user-name-header { font-size: 0.9rem; font-weight: 800; color: #fff; line-height: 1.2; }
        .user-role-header { font-size: 0.75rem; color: var(--accent-cyan); font-weight: 700; }
        .page-title { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 10px; color: var(--accent-cyan); }
        .header-actions { display: flex; gap: 10px; }
        .btn { padding: 10px 20px; border: none; border-radius: 12px; font-family: inherit; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 8px; text-decoration: none; transition: 0.2s; background: var(--accent-primary); color: white; }
        .btn:hover { background: #7c3aed; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3); }

        /* --- المساحة الرئيسية --- */
        #workspace { width: 100%; height: calc(100vh - 75px); display: flex; flex-direction: column; padding: 15px 30px; position: relative; }
        .grid-container { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); grid-template-rows: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; overflow: hidden; }

        /* --- بطاقة المستخدم --- */
        .user-card { position: relative; border-radius: 20px; overflow: hidden; background-size: cover; background-position: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6); cursor: grab; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .user-card:active { cursor: grabbing; }
        .user-card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 20px rgba(139, 92, 246, 0.3); border-color: rgba(139, 92, 246, 0.5); }
        .card-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.1) 40%, rgba(10,11,15,0.95) 100%); z-index: 1; }
        .card-content { position: relative; z-index: 2; padding: 15px; display: flex; flex-direction: column; height: 100%; justify-content: space-between; }
        .card-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .action-btn { width: 38px; height: 38px; border-radius: 50%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; color: white; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; transition: 0.2s; }
        .action-btn:hover { background: var(--accent-primary); transform: scale(1.1); }
        .action-btn i { width: 18px; height: 18px; }
        .user-info-bottom { display: flex; flex-direction: column; gap: 5px; }
        .user-name { font-size: 1.1rem; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .user-role { font-size: 0.8rem; color: var(--accent-cyan); font-weight: 700; background: rgba(6, 182, 212, 0.15); padding: 2px 8px; border-radius: 6px; width: fit-content; backdrop-filter: blur(4px); }

        /* --- الشرائط الجانبية --- */
        .sidebar-left { width: var(--notes-width); height: calc(100vh - 30px); margin: 15px; background: var(--bg-surface); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 20px; position: fixed; right: 15px; top: 0; z-index: 100; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.6); transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s; }
        .sidebar-left.hidden { transform: translateX(calc(100% + 30px)); opacity: 0; pointer-events: none; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-title { font-size: 1rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .notes-dock { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }

        .sidebar-right { width: var(--sidebar-width); height: calc(100vh - 30px); margin: 15px; background: var(--bg-surface); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 20px; position: fixed; left: 15px; top: 0; z-index: 100; display: flex; box-shadow: 0 20px 50px rgba(0,0,0,0.6); transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s; overflow: hidden; }
        .sidebar-right.hidden { transform: translateX(calc(-100% - 30px)); opacity: 0; pointer-events: none; }
        .app-rail { width: 70px; background: rgba(0,0,0,0.3); display: flex; flex-direction: column; align-items: center; padding: 15px 0; gap: 15px; border-left: 1px solid var(--glass-border); border-radius: 0 20px 20px 0; }
        .app-view { flex: 1; display: flex; flex-direction: column; }
        .app-header { height: 55px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--glass-border); }
        .iframe-container { flex: 1; background: #000; display: flex; justify-content: center; align-items: center; color: var(--text-muted); }

        /* --- Drawer top --- */
        .top-dashboard-drawer { position: fixed; top: 0; left: 0; right: 0; background: rgba(10, 11, 15, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); transform: translateY(-100%); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); z-index: 1000; padding: 15px 30px; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .top-dashboard-drawer.active { transform: translateY(0); }
        .drawer-nav { display: flex; justify-content: center; gap: 30px; }
        .drawer-item { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #888; text-decoration: none; font-size: 0.75rem; font-weight: 700; transition: 0.3s; }
        .drawer-icon-wrap { width: 56px; height: 56px; border-radius: 16px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: center; align-items: center; transition: 0.3s; }
        .drawer-item:hover { color: #fff; }
        .drawer-item:hover .drawer-icon-wrap { background: rgba(255, 255, 255, 0.08); transform: translateY(-3px); }

        /* --- Modal --- */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 10000; opacity: 0; visibility: hidden; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: #12141c; border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 30px; width: 90%; max-width: 450px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); transform: translateY(20px); transition: 0.4s; }
        .modal-overlay.active .modal-box { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .modal-title { font-size: 1.2rem; font-weight: 800; color: var(--accent-cyan); }
        .modal-close { background: none; border: none; color: #888; font-size: 1.5rem; cursor: pointer; }
        .detail-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 1rem; color: #ccc; }
        .detail-row strong { color: white; }

        .sortable-ghost { opacity: 0.3; border: 2px dashed var(--accent-primary); }
        .toggle-btn { position: fixed; top: 50%; transform: translateY(-50%); background: var(--bg-surface); border: 1px solid var(--glass-border); color: var(--text-main); padding: 20px 10px; cursor: pointer; z-index: 101; transition: 0.3s; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .toggle-right-side { right: 0; border-radius: 10px 0 0 10px; }
        .toggle-left-side { left: 0; border-radius: 0 10px 10px 0; }
        
        /* Backgrounds Pool */
        .bg-p1 { background-image: url('https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=500&auto=format&fit=crop'); }
        .bg-p2 { background-image: url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=500&auto=format&fit=crop'); }
        .bg-p3 { background-image: url('https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=500&auto=format&fit=crop'); }
        .bg-p4 { background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=500&auto=format&fit=crop'); }
        .bg-p5 { background-image: url('https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=500&auto=format&fit=crop'); }
        .bg-p6 { background-image: url('https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=500&auto=format&fit=crop'); }
        .bg-p7 { background-image: url('https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?q=80&w=500&auto=format&fit=crop'); }
        .bg-p8 { background-image: url('https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?q=80&w=500&auto=format&fit=crop'); }
        .bg-p9 { background-image: url('https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=500&auto=format&fit=crop'); }
        .bg-p10 { background-image: url('https://images.unsplash.com/photo-1501196354995-cbb51c65aaea?q=80&w=500&auto=format&fit=crop'); }
    </style>
</head>
<body>

    <div class="top-dashboard-drawer" id="topDrawer">
        <div class="drawer-nav">
            <a href="../dashboard.html" class="drawer-item"><div class="drawer-icon-wrap"><i data-lucide="layout-dashboard"></i></div>الرئيسية</a>
            <a href="../ordix/orders.html" class="drawer-item"><div class="drawer-icon-wrap"><i data-lucide="shopping-bag"></i></div>الطلبات</a>
            <a href="list.html" class="drawer-item"><div class="drawer-icon-wrap" style="border-color: var(--accent-cyan);"><i data-lucide="users" style="color: var(--accent-cyan);"></i></div>المستخدمين</a>
            <a href="../ordix/settings.html" class="drawer-item"><div class="drawer-icon-wrap"><i data-lucide="settings"></i></div>الإعدادات</a>
        </div>
    </div>

    <div class="top-header">
        <a href="#" class="user-profile-header">
            <div class="user-info-header">
                <div class="user-name-header" id="adminName">جاري التحميل...</div>
                <div class="user-role-header" id="adminRole">...</div>
            </div>
            <img src="" alt="Admin" class="user-avatar-header" id="adminAvatar">
        </a>
        <h1 class="page-title"><i data-lucide="users"></i> فريق العمل</h1>
        <div class="header-actions">
            <a href="create.html" class="btn"><i data-lucide="user-plus"></i> إضافة مستخدم</a>
        </div>
    </div>

    <button class="toggle-btn toggle-right-side" onclick="toggleLeftSidebar()" id="btnToggleLeft" style="opacity: 1;"><i data-lucide="sticky-note"></i></button>
    <button class="toggle-btn toggle-left-side" onclick="toggleRightSidebar()" id="btnToggleRight" style="opacity: 1;"><i data-lucide="layout-sidebar"></i></button>

    <div class="sidebar-left hidden" id="sidebarLeft">
        <div class="sidebar-header">
            <div class="sidebar-title"><i data-lucide="sticky-note"></i> الملاحظات</div>
            <button class="btn-add-note" onclick="alert('إضافة ملاحظة جديدة')"><i data-lucide="plus" style="width:16px;"></i></button>
        </div>
        <div class="notes-dock">
            <p style="color: #888; text-align: center; margin-top: 20px;">لا توجد ملاحظات حالياً.</p>
        </div>
    </div>

    <div class="sidebar-right hidden" id="sidebarRight">
        <div class="app-rail">
            <div class="rail-icon active"><i data-lucide="youtube"></i></div>
            <div class="rail-icon"><i data-lucide="message-circle"></i></div>
        </div>
        <div class="app-view">
            <div class="app-header">
                <div class="app-title">المساعد الجانبي</div>
                <button onclick="toggleRightSidebar()" style="background:none; border:none; color:#888; cursor:pointer;"><i data-lucide="x"></i></button>
            </div>
            <div class="iframe-container">
                <span>مساحة مخصصة للتطبيقات</span>
            </div>
        </div>
    </div>

    <div id="workspace">
        <div class="grid-container" id="usersGrid">
            <div style="grid-column: 1/-1; text-align: center; color: #888; margin-top: 50px;">جاري تحميل بيانات المستخدمين...</div>
        </div>
    </div>

    <div class="modal-overlay" id="userModal">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title" id="mName">اسم المستخدم</div>
                <button class="modal-close" onclick="closeUserDetails(event)">×</button>
            </div>
            <div class="detail-row"><span>الصلاحية:</span> <strong id="mRole">---</strong></div>
            <div class="detail-row"><span>كود الدخول:</span> <strong id="mCode">---</strong></div>
            <div class="detail-row"><span>رقم الهاتف:</span> <strong id="mPhone">---</strong></div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // 1. إعداد بيانات الأدمن من الجلسة
        const adminName = localStorage.getItem('userName') || 'المدير';
        const adminRole = localStorage.getItem('userRole') || 'Admin';
        const adminAvatar = localStorage.getItem('userAvatar') || `https://ui-avatars.com/api/?name=${encodeURIComponent(adminName)}&background=8b5cf6&color=fff`;

        document.getElementById('adminName').innerText = adminName;
        document.getElementById('adminRole').innerText = adminRole;
        document.getElementById('adminAvatar').src = adminAvatar;

        // 2. جلب المستخدمين من السيرفر
        const grid = document.getElementById('usersGrid');
        const bgClasses = ['bg-p1', 'bg-p2', 'bg-p3', 'bg-p4', 'bg-p5', 'bg-p6', 'bg-p7', 'bg-p8', 'bg-p9', 'bg-p10'];

        async function loadUsers() {
            const token = localStorage.getItem('ione_admin_token');
            try {
                const res = await fetch('/api/users/list', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                
                if (data.success && data.users.length > 0) {
                    grid.innerHTML = data.users.map((u, index) => {
                        const bgClass = bgClasses[index % bgClasses.length]; // توزيع الخلفيات
                        const phone = u.phone || '';
                        return `
                        <div class="user-card ${bgClass}" onclick="openUserDetails('${u.full_name}', '${u.role}', '${u.userCode || u.email}', '${phone}')">
                            <div class="card-overlay"></div>
                            <div class="card-content">
                                <div class="card-actions">
                                    <button class="action-btn" onclick="sendWhatsApp(event, '${phone}')" title="واتساب"><i data-lucide="message-circle"></i></button>
                                    <button class="action-btn" onclick="sendTask(event, '${u.full_name}')" title="إرسال مهمة"><i data-lucide="bell"></i></button>
                                </div>
                                <div class="user-info-bottom">
                                    <div class="user-name">${u.full_name}</div>
                                    <div class="user-role">${u.role}</div>
                                    <div style="font-size: 0.75rem; color: #aaa; font-family: monospace;">ID: #${u.userCode || '---'}</div>
                                </div>
                            </div>
                        </div>
                        `;
                    }).join('');
                } else {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #888; margin-top: 50px;">لا يوجد مستخدمون حتى الآن. ابدأ بإضافة مستخدم.</div>';
                }
                lucide.createIcons();
                initSortable();
            } catch (error) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: red; margin-top: 50px;">حدث خطأ في الاتصال بالسيرفر.</div>';
            }
        }

        function initSortable() {
            new Sortable(grid, {
                animation: 200,
                ghostClass: 'sortable-ghost',
                swapThreshold: 0.65
            });
        }

        // 3. تفاعلات البطاقات
        let isDragging = false;
        grid.addEventListener('mousedown', () => isDragging = false);
        grid.addEventListener('mousemove', () => isDragging = true);

        function openUserDetails(name, role, code, phone) {
            if (isDragging) return;
            document.getElementById('mName').innerText = name;
            document.getElementById('mRole').innerText = role;
            document.getElementById('mCode').innerText = code;
            document.getElementById('mPhone').innerText = phone || 'غير متوفر';
            document.getElementById('userModal').classList.add('active');
        }

        function closeUserDetails(e) {
            if(e) e.stopPropagation();
            document.getElementById('userModal').classList.remove('active');
        }

        function sendWhatsApp(event, phone) {
            event.stopPropagation(); 
            if(!phone) { alert('رقم الهاتف غير مسجل لهذا المستخدم.'); return; }
            const message = "مرحباً، لديك رسالة من لوحة التحكم.";
            window.open(`https://wa.me/${phone.replace(/[^0-9]/g, '')}?text=${encodeURIComponent(message)}`, '_blank');
        }

        function sendTask(event, name) {
            event.stopPropagation();
            alert(`سيتم فتح نافذة لإرسال مهمة إلى: ${name}`);
        }

        document.getElementById('userModal').addEventListener('click', function(e) {
            if(e.target === this) closeUserDetails();
        });

        // 4. الشرائط والاختصارات (X, C, V, Z)
        let userInteracted = false;
        const sidebarLeft = document.getElementById('sidebarLeft');
        const sidebarRight = document.getElementById('sidebarRight');
        
        function toggleLeftSidebar() { userInteracted = true; sidebarLeft.classList.toggle('hidden'); document.getElementById('btnToggleLeft').style.opacity = sidebarLeft.classList.contains('hidden') ? '1' : '0'; }
        function toggleRightSidebar() { userInteracted = true; sidebarRight.classList.toggle('hidden'); document.getElementById('btnToggleRight').style.opacity = sidebarRight.classList.contains('hidden') ? '1' : '0'; }

        document.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT') return;
            
            if (e.key.toLowerCase() === 'x') document.getElementById('topDrawer').classList.toggle('active');
            if (e.key.toLowerCase() === 'c') alert('سيتم فتح لوحة التحكم هنا (Controller)'); // يمكنك ربطها لاحقاً
            if (e.key.toLowerCase() === 'v' || e.key.toLowerCase() === 'z') {
                userInteracted = true;
                sidebarLeft.classList.toggle('hidden');
                sidebarRight.classList.toggle('hidden');
                document.getElementById('btnToggleLeft').style.opacity = sidebarLeft.classList.contains('hidden') ? '1' : '0';
                document.getElementById('btnToggleRight').style.opacity = sidebarRight.classList.contains('hidden') ? '1' : '0';
            }
        });

        window.onload = loadUsers;
    </script>
</body>
</html>
