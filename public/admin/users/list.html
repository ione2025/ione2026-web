<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IONECENTER — إدارة المستخدمين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-body: #0b0c10; --bg-surface: rgba(18, 20, 28, 0.7); --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc; --accent-primary: #8b5cf6; --accent-cyan: #06b6d4; --accent-green: #10b981; --accent-red: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-body); background-image: radial-gradient(circle at center, #151b29 0%, #0b0c10 100%); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* الشريط العلوي */
        .top-dashboard-drawer { position: fixed; top: 10px; left: 50%; transform: translateX(-50%) translateY(-150%); width: 90%; max-width: 700px; background: rgba(18, 20, 28, 0.6); backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; z-index: 1000; padding: 15px 30px; display: flex; justify-content: center; align-items: center; box-shadow: 0 30px 60px rgba(0,0,0,0.8); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; opacity: 0; }
        .top-dashboard-drawer.active { transform: translateX(-50%) translateY(0); pointer-events: auto; opacity: 1; }
        .drawer-nav { display: flex; justify-content: center; gap: 40px; }
        .drawer-item { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #aaa; text-decoration: none; font-size: 0.75rem; font-weight: 700; transition: 0.3s; }
        .drawer-icon-wrap { width: 55px; height: 55px; border-radius: 16px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: center; align-items: center; transition: 0.3s; }
        .drawer-item:hover { color: #fff; }
        .drawer-item:hover .drawer-icon-wrap { background: rgba(139, 92, 246, 0.2); transform: translateY(-3px); border-color: var(--accent-primary); }

        /* الهيدر */
        .top-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 30px; background: rgba(10, 11, 15, 0.95); border-bottom: 1px solid var(--glass-border); flex-shrink: 0; position: relative; z-index: 10; }
        .user-profile-header { display: flex; align-items: center; gap: 12px; background: rgba(255, 255, 255, 0.03); padding: 6px 16px 6px 6px; border-radius: 50px; border: 1px solid var(--glass-border); text-decoration: none; color: #fff; }
        .user-avatar-header { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-primary); }
        .user-info-header { display: flex; flex-direction: column; align-items: flex-start; }
        .user-name-header { font-size: 0.85rem; font-weight: 800; }
        .user-role-header { font-size: 0.7rem; color: var(--accent-cyan); font-weight: 700; }
        .hover-trigger { flex: 1; height: 100%; min-height: 40px; cursor: pointer; }
        
        .btn-add { background: var(--accent-primary); color: white; padding: 8px 16px; border-radius: 10px; text-decoration: none; font-weight: 700; display: flex; align-items: center; gap: 5px; font-size: 0.9rem; transition: 0.2s; }
        .btn-add:hover { background: #7c3aed; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(139, 92, 246, 0.3); }
        .btn-back { background: transparent; border: 1px solid var(--glass-border); color: #fff; padding: 8px 16px; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; font-weight: 700; transition: 0.2s; font-size: 0.9rem; margin-left: 10px; }
        .btn-back:hover { background: rgba(255,255,255,0.1); }

        /* شبكة المستخدمين */
        .main-container { flex: 1; display: flex; padding: 20px 30px; overflow: hidden; }
        .users-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px; 
            width: 100%; 
            overflow-y: auto; 
            padding: 5px;
            align-content: start;
        }
        .users-grid::-webkit-scrollbar { width: 0px; }

        /* البطاقة */
        .user-card { position: relative; height: 200px; border-radius: 16px; overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: 0.3s; background: #111; box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: flex-end; }
        .user-card:hover { transform: translateY(-5px); border-color: var(--accent-primary); box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3); }
        .user-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.2) 50%, transparent 100%); z-index: 2; }
        .card-info { position: relative; z-index: 3; padding: 12px; text-align: center; }
        .user-name { font-size: 0.95rem; font-weight: 800; color: #fff; margin-bottom: 2px; }
        .user-role { font-size: 0.7rem; color: var(--accent-cyan); font-weight: bold; background: rgba(6, 182, 212, 0.15); padding: 2px 8px; border-radius: 6px; display: inline-block; backdrop-filter: blur(5px); }
        
        /* أزرار التعديل والحذف */
        .action-buttons { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 4; opacity: 0; transition: 0.3s; transform: translateX(20px); }
        .user-card:hover .action-buttons { opacity: 1; transform: translateX(0); }
        .action-btn { width: 35px; height: 35px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; border: none; color: white; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .action-btn.edit { background: var(--accent-primary); }
        .action-btn.edit:hover { background: #7c3aed; transform: scale(1.1); }
        .action-btn.delete { background: var(--accent-red); }
        .action-btn.delete:hover { background: #dc2626; transform: scale(1.1); }
        .action-btn i { width: 16px; height: 16px; }
        .hide-delete { display: none !important; }

        /* الإشعارات */
        .custom-alert { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #10b981; color: white; padding: 15px 30px; border-radius: 12px; font-weight: bold; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 9999; transition: 0.3s; opacity: 0; display: flex; align-items: center; gap: 10px; }
        .custom-alert.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .custom-alert.error { background: #ef4444; }
    </style>
</head>
<body>

    <div class="custom-alert" id="customAlert"><i data-lucide="check-circle"></i> <span id="alertText">تم بنجاح</span></div>

    <div class="top-dashboard-drawer" id="topDashboard">
        <div class="drawer-nav">
            <a href="../../dashboard.html" class="drawer-item">
                <div class="drawer-icon-wrap"><i data-lucide="layout-dashboard"></i></div>
                الرئيسية
            </a>
            <a href="list.html" class="drawer-item">
                <div class="drawer-icon-wrap"><i data-lucide="users"></i></div>
                المستخدمين
            </a>
            <a href="#" class="drawer-item">
                <div class="drawer-icon-wrap"><i data-lucide="shopping-bag"></i></div>
                الطلبات
            </a>
            <a href="#" class="drawer-item">
                <div class="drawer-icon-wrap"><i data-lucide="settings"></i></div>
                الإعدادات
            </a>
        </div>
    </div>

    <div class="top-header">
        <a href="#" class="user-profile-header">
            <div class="user-info-header">
                <div class="user-name-header" id="headerUserName">جاري التحميل...</div>
                <div class="user-role-header" id="headerUserRole">...</div>
            </div>
            <img src="" alt="Admin" class="user-avatar-header" id="headerUserAvatar">
        </a>
        
        <div class="hover-trigger" id="hoverArea"></div>
        
        <div style="display: flex; gap: 10px;">
            <a href="../../dashboard.html" class="btn-back"><i data-lucide="arrow-right"></i> رجوع</a>
            <a href="create.html" class="btn-add"><i data-lucide="user-plus"></i> إضافة مستخدم</a>
        </div>
    </div>

    <div class="main-container">
        <div class="users-grid" id="usersGrid">
            <p style="color:#888; grid-column: 1/-1; text-align: center; margin-top: 50px;">جاري تحميل المستخدمين...</p>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // 1. إعداد بيانات الأدمن
        const currentUserName = localStorage.getItem('userName') || 'المدير';
        const currentUserRole = localStorage.getItem('userRole') || 'Admin';
        const currentUserAvatar = localStorage.getItem('userAvatar') || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUserName)}&background=8b5cf6&color=fff`;
        document.getElementById('headerUserName').innerText = currentUserName;
        document.getElementById('headerUserRole').innerText = currentUserRole;
        document.getElementById('headerUserAvatar').src = currentUserAvatar;

        const isAdmin = currentUserRole.toLowerCase() === 'admin' || currentUserRole.toLowerCase() === 'ceo';

        // 2. الشريط العلوي
        const hoverArea = document.getElementById('hoverArea');
        const drawer = document.getElementById('topDashboard');
        hoverArea.addEventListener('mouseenter', () => drawer.classList.add('active'));
        drawer.addEventListener('mouseleave', () => drawer.classList.remove('active'));

        // 3. الإشعارات
        function showCustomAlert(msg, isError = false) {
            const alertBox = document.getElementById('customAlert');
            document.getElementById('alertText').innerText = msg;
            alertBox.className = 'custom-alert show' + (isError ? ' error' : '');
            if(isError) alertBox.innerHTML = `<i data-lucide="alert-circle"></i> <span id="alertText">${msg}</span>`;
            else alertBox.innerHTML = `<i data-lucide="check-circle"></i> <span id="alertText">${msg}</span>`;
            lucide.createIcons();
            setTimeout(() => alertBox.classList.remove('show'), 3000);
        }

        // 4. جلب المستخدمين
        async function loadUsers() {
            const token = localStorage.getItem('ione_admin_token');
            const grid = document.getElementById('usersGrid');
            
            try {
                const res = await fetch('/api/users/list', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                
                if (data.success && data.users.length > 0) {
                    grid.innerHTML = data.users.map(u => {
                        const imgUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(u.full_name)}&background=random&size=200`;
                        const deleteBtnClass = isAdmin ? 'action-btn delete' : 'action-btn delete hide-delete';
                        
                        return `
                        <div class="user-card" onclick="openUserModal('${u.userCode || u.email}', '${u.full_name}', '${u.role}')">
                            <img src="${imgUrl}" alt="${u.full_name}">
                            <div class="card-overlay"></div>
                            
                            <div class="action-buttons">
                                <button class="${deleteBtnClass}" onclick="deleteUser(event, '${u.userCode || u.email}', '${u.full_name}')" title="حذف">
                                    <i data-lucide="trash-2"></i>
                                </button>
                                <button class="action-btn edit" onclick="editUser(event, '${u.userCode || u.email}')" title="تعديل">
                                    <i data-lucide="pencil"></i>
                                </button>
                            </div>

                            <div class="card-info">
                                <div class="user-name">${u.full_name}</div>
                                <div class="user-role">${u.role}</div>
                            </div>
                        </div>
                        `;
                    }).join('');
                } else {
                    grid.innerHTML = '<p style="color:#888; grid-column: 1/-1; text-align: center; margin-top: 50px;">لا يوجد مستخدمون حالياً.</p>';
                }
                lucide.createIcons();
            } catch (error) {
                grid.innerHTML = '<p style="color:#ef4444; grid-column: 1/-1; text-align: center; margin-top: 50px;">حدث خطأ في الاتصال بالسيرفر.</p>';
            }
        }

        // 5. وظيفة الحذف (حقيقية)
        async function deleteUser(event, id, name) {
            event.stopPropagation();
            if (!isAdmin) { showCustomAlert('عذراً، لا تملك صلاحية الحذف.', true); return; }
            
            if(confirm(`هل أنت متأكد من حذف المستخدم: ${name}؟`)) {
                const token = localStorage.getItem('ione_admin_token');
                try {
                    const res = await fetch('/api/users/delete', { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, 
                        body: JSON.stringify({ id: id }) 
                    });
                    const data = await res.json();
                    
                    if(data.success) {
                        showCustomAlert('تم حذف المستخدم بنجاح');
                        loadUsers(); // إعادة تحميل القائمة
                    } else {
                        showCustomAlert(data.error || 'فشل الحذف', true);
                    }
                } catch(e) { showCustomAlert('فشل الاتصال بالسيرفر', true); }
            }
        }

        // 6. وظيفة التعديل (توجيه لصفحة التعديل)
        function editUser(event, id) {
            event.stopPropagation();
            // التوجيه لصفحة التعديل مع تمرير الكود
            window.location.href = `edit.html?id=${id}`;
        }

        // 7. فتح نافذة التفاصيل
        function openUserModal(id, name, role) {
            // هذه الدالة يمكن تطويرها لاحقاً لعرض المزيد من التفاصيل
            console.log('Details:', id, name, role);
        }

        window.onload = loadUsers;
    </script>
</body>
</html>
