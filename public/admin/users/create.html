<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IONECENTER — إضافة مستخدم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-body: #0b0c10; --bg-surface: rgba(18, 20, 28, 0.7); --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc; --text-muted: #94a3b8; --accent-cyan: #06b6d4; --accent-green: #10b981; --accent-red: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-body); background-image: radial-gradient(circle at center, #151b29 0%, #0b0c10 100%); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .create-container { width: 100%; max-width: 700px; background: var(--bg-surface); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); position: relative; }
        .create-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        .create-title { font-size: 1.4rem; font-weight: 800; color: var(--accent-cyan); display: flex; align-items: center; gap: 10px; }
        
        .form-row { display: flex; gap: 15px; margin-bottom: 20px; }
        .form-group { flex: 1; }
        .form-label { display: block; font-size: 0.9rem; font-weight: 700; color: #ccc; margin-bottom: 8px; }
        .form-input { width: 100%; padding: 14px; background: #000; border: 1px solid var(--glass-border); border-radius: 12px; color: #fff; font-family: inherit; outline: none; transition: 0.2s; font-size: 1rem; }
        .form-input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 10px rgba(6,182,212,0.2); }
        
        .permissions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; border: 1px solid var(--glass-border); margin-top: 10px; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; cursor: pointer; color: #ccc; }
        .checkbox-label input { accent-color: var(--accent-cyan); width: 18px; height: 18px; cursor: pointer; }
        
        .btn-submit { width: 100%; padding: 16px; background: var(--accent-green); color: #fff; border: none; border-radius: 12px; font-family: inherit; font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: 0.2s; margin-top: 20px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-submit:hover { background: #059669; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .btn-back { background: transparent; border: 1px solid var(--glass-border); color: #fff; padding: 8px 15px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; font-weight: 700; transition: 0.2s; }
        .btn-back:hover { background: rgba(255,255,255,0.1); }

        .toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: var(--accent-green); color: #fff; padding: 15px 30px; border-radius: 12px; font-weight: 700; z-index: 10001; transition: 0.4s; display: flex; align-items: center; gap: 10px; font-size: 1.1rem; }
        .toast.show { bottom: 30px; }
        .toast.error { background: var(--accent-red); }
    </style>
</head>
<body>
    <div class="toast" id="toast"><i data-lucide="check-circle"></i> <span id="toastMessage">تم بنجاح</span></div>

    <div class="create-container">
        <div class="create-header">
            <div class="create-title"><i data-lucide="user-plus"></i> إضافة مستخدم جديد</div>
            <!-- تم إصلاح علامة التنصيص هنا -->
            <a href="../controller.html" class="btn-back"><i data-lucide="arrow-right"></i> رجوع</a>
        </div>

        <form id="createUserForm">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">الاسم الكامل</label>
                    <input type="text" id="userName" class="form-input" placeholder="مثال: أحمد محمد" required>
                </div>
                <div class="form-group">
                    <label class="form-label">البريد الإلكتروني</label>
                    <input type="email" id="userEmail" class="form-input" placeholder="ahmad@example.com" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" id="userPassword" class="form-input" placeholder="******" required>
                </div>
                <div class="form-group">
                    <label class="form-label">كود الدخول (للدخول السريع)</label>
                    <input type="text" id="userCode" class="form-input" placeholder="1001" maxlength="6" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">رقم الهاتف</label>
                    <input type="text" id="userPhone" class="form-input" placeholder="+966 50 123 4567">
                </div>
                <div class="form-group">
                    <label class="form-label">العنوان</label>
                    <input type="text" id="userAddress" class="form-input" placeholder="المدينة، الحي">
                </div>
            </div>

            <div class="form-group" style="margin-top: 15px;">
                <label class="form-label">الصلاحيات</label>
                <div class="permissions-grid">
                    <label class="checkbox-label"><input type="checkbox" value="admin" class="perm-checkbox"> مدير (Admin)</label>
                    <label class="checkbox-label"><input type="checkbox" value="sales" class="perm-checkbox"> مبيعات (Sales)</label>
                    <label class="checkbox-label"><input type="checkbox" value="accounting" class="perm-checkbox"> محاسبة (Accounting)</label>
                    <label class="checkbox-label"><input type="checkbox" value="support" class="perm-checkbox"> دعم (Support)</label>
                    <label class="checkbox-label"><input type="checkbox" value="warehouse" class="perm-checkbox"> مستودعات (Warehouse)</label>
                    <label class="checkbox-label"><input type="checkbox" value="hr" class="perm-checkbox"> موارد بشرية (HR)</label>
                    <label class="checkbox-label"><input type="checkbox" value="marketing" class="perm-checkbox"> تسويق (Marketing)</label>
                    <label class="checkbox-label"><input type="checkbox" value="viewer" class="perm-checkbox"> مشاهدة (Viewer)</label>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <i data-lucide="save"></i> حفظ المستخدم
            </button>
        </form>
    </div>

    <script>
        lucide.createIcons();

        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader" class="spin"></i> جاري الحفظ...';
            lucide.createIcons();

            // جمع البيانات
            const name = document.getElementById('userName').value.trim();
            const email = document.getElementById('userEmail').value.trim();
            const password = document.getElementById('userPassword').value;
            const userCode = document.getElementById('userCode').value.trim();
            const phone = document.getElementById('userPhone').value.trim();
            const address = document.getElementById('userAddress').value.trim();
            
            const permissions = Array.from(document.querySelectorAll('.perm-checkbox:checked')).map(cb => cb.value);
            
            if (permissions.length === 0) {
                showToast('يرجى تحديد صلاحية واحدة على الأقل', true);
                resetBtn();
                return;
            }

            const token = localStorage.getItem('ione_admin_token');
            if (!token) {
                showToast('انتهت الجلسة، يرجى تسجيل الدخول مجدداً', true);
                setTimeout(() => window.location.href = '../login.html', 1500); // تم إصلاح المسار هنا
                return;
            }

            try {
                // إرسال البيانات إلى الـ API
                const response = await fetch('/api/users/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        full_name: name,
                        role: permissions.includes('admin') ? 'admin' : 'user',
                        permissions: permissions,
                        active: true,
                        userCode: userCode,
                        phone: phone,
                        address: address
                    })
                });

                const textResponse = await response.text();
                let data;

                try {
                    data = JSON.parse(textResponse);
                } catch (err) {
                    console.error("Server returned non-JSON:", textResponse);
                    showToast(`فشل (كود ${response.status}): المتصفح لم يستقبل JSON.`, true);
                    resetBtn();
                    return;
                }

                if (!response.ok || !data.success) {
                    showToast('فشل الإنشاء: ' + (data.error || 'خطأ غير معروف'), true);
                    resetBtn();
                    return;
                }

                // نجاح
                showToast('تم إضافة المستخدم بنجاح!');
                
                setTimeout(() => {
                    window.location.href = 'list.html';
                }, 1500);


            } catch (error) {
                console.error("Fetch failed:", error);
                showToast('فشل الاتصال بالسيرفر. تحقق من Console (F12).', true);
                resetBtn();
            }

            function resetBtn() {
                btn.disabled = false;
                btn.innerHTML = originalText;
                lucide.createIcons();
            }
        });

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = msg;
            toast.className = 'toast show' + (isError ? ' error' : '');
            if (isError) toast.innerHTML = `<i data-lucide="alert-circle"></i> <span id="toastMessage">${msg}</span>`;
            else toast.innerHTML = `<i data-lucide="check-circle"></i> <span id="toastMessage">${msg}</span>`;
            
            lucide.createIcons();
            setTimeout(() => toast.classList.remove('show'), 4000);
        }
    </script>
</body>
</html>
