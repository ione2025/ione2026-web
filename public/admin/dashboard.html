<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>IONECENTER — Dashboard</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/logo.png">
    
    <!-- Styles -->
    <link rel="stylesheet" href="admin.css">
    
    <style>
        /* Dashboard Specific Styles */
        .dashboard-page {
            background: #f5f5f7;
            min-height: 100vh;
            display: block;
            padding: 0;
        }

        .top-bar {
            background: white;
            border-bottom: 1px solid #d2d2d7;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 3px rgba(0,0,0,.04);
        }

        .top-bar-logo img {
            height: 32px;
        }

        .top-bar-user {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 0.9rem;
            color: #6e6e73;
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 1px solid #d2d2d7;
            color: #1d1d1f;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            background: #FF3B30;
            color: white;
            border-color: #FF3B30;
        }

        .logout-btn svg {
            width: 16px;
            height: 16px;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px;
        }

        .dashboard-header {
            margin-bottom: 32px;
        }

        .dashboard-title {
            font-family: 'Inter', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: #1d1d1f;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .dashboard-subtitle {
            color: #6e6e73;
            font-size: 1rem;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            border: 1px solid #d2d2d7;
            box-shadow: 0 1px 3px rgba(0,0,0,.04);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,.08);
        }

        .stat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(227,30,36,.1);
            color: #E31E24;
        }

        .stat-icon.blue {
            background: rgba(0,113,227,.1);
            color: #0071e3;
        }

        .stat-icon.green {
            background: rgba(52,199,89,.1);
            color: #34C759;
        }

        .stat-icon.orange {
            background: rgba(255,159,10,.1);
            color: #FF9F0A;
        }

        .stat-icon svg {
            width: 22px;
            height: 22px;
        }

        .stat-value {
            font-family: 'Inter', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: #1d1d1f;
            margin-bottom: 4px;
            line-height: 1;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #6e6e73;
            font-weight: 500;
        }

        /* Content Sections */
        .content-section {
            background: white;
            border-radius: 16px;
            border: 1px solid #d2d2d7;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 1px 3px rgba(0,0,0,.04);
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #d2d2d7;
        }

        .section-title {
            font-family: 'Inter', sans-serif;
            font-size: 1.125rem;
            font-weight: 700;
            color: #1d1d1f;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title svg {
            width: 20px;
            height: 20px;
            color: #E31E24;
        }

        .section-action {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f5f5f7;
            border: none;
            color: #1d1d1f;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .section-action:hover {
            background: #E31E24;
            color: white;
        }

        .section-action svg {
            width: 16px;
            height: 16px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: #6e6e73;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 0.95rem;
        }

        /* Quick Actions */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .quick-action {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: #f5f5f7;
            border-radius: 12px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: #1d1d1f;
            font-family: 'Cairo', sans-serif;
        }

        .quick-action:hover {
            background: white;
            border-color: #E31E24;
            transform: translateX(-4px);
        }

        .quick-action svg {
            width: 20px;
            height: 20px;
            color: #E31E24;
        }

        .quick-action-text {
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .top-bar {
                padding: 12px 16px;
            }
            .dashboard-container {
                padding: 16px;
            }
            .dashboard-title {
                font-size: 1.5rem;
            }
            .stat-value {
                font-size: 1.5rem;
            }
            .top-bar-user span {
                display: none;
            }
        }
    </style>
</head>
<body class="dashboard-page">
    
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-bar-logo">
            <img src="../assets/logo.png" alt="IONE CENTER">
        </div>
        <div class="top-bar-user">
            <span>👤 Admin</span>
            <button class="logout-btn" id="logoutBtn">
                <i data-lucide="log-out"></i>
                <span>خروج</span>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="dashboard-container">
        
        <!-- Header -->
        <div class="dashboard-header">
            <h1 class="dashboard-title">لوحة التحكم</h1>
            <p class="dashboard-subtitle">مرحباً بك في لوحة إدارة IONECENTER</p>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            
            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon">
                        <i data-lucide="users"></i>
                    </div>
                </div>
                <div class="stat-value" id="subscribersCount">0</div>
                <div class="stat-label">المشتركون</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon blue">
                        <i data-lucide="eye"></i>
                    </div>
                </div>
                <div class="stat-value" id="visitsCount">0</div>
                <div class="stat-label">الزيارات</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon green">
                        <i data-lucide="calendar"></i>
                    </div>
                </div>
                <div class="stat-value" id="daysLeft">30</div>
                <div class="stat-label">يوم للإطلاق</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon orange">
                        <i data-lucide="activity"></i>
                    </div>
                </div>
                <div class="stat-value" id="statusText">نشط</div>
                <div class="stat-label">حالة الموقع</div>
            </div>

        </div>

        <!-- Subscribers Section -->
        <div class="content-section">
            <div class="section-header">
                <div class="section-title">
                    <i data-lucide="mail"></i>
                    <span>المشتركون بالبريد</span>
                </div>
                <button class="section-action" id="exportBtn">
                    <i data-lucide="download"></i>
                    <span>تصدير Excel</span>
                </button>
            </div>
            <div id="subscribersList">
                <div class="empty-state">
                    <i data-lucide="inbox"></i>
                    <p>لا يوجد مشتركون بعد</p>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="content-section">
            <div class="section-header">
                <div class="section-title">
                    <i data-lucide="zap"></i>
                    <span>إجراءات سريعة</span>
                </div>
            </div>
            <div class="quick-actions">
                <a href="../index.html" target="_blank" class="quick-action">
                    <i data-lucide="external-link"></i>
                    <span class="quick-action-text">عرض الموقع</span>
                </a>
                <a href="#" class="quick-action" id="editContentBtn">
                    <i data-lucide="edit-3"></i>
                    <span class="quick-action-text">تعديل المحتوى</span>
                </a>
                <a href="#" class="quick-action" id="clearCacheBtn">
                    <i data-lucide="refresh-cw"></i>
                    <span class="quick-action-text">مسح الكاش</span>
                </a>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="admin.js"></script>
    <script>
        // ═══════════════════════════════════════════════════
        // 🔐 Check Auth — must be logged in
        // ═══════════════════════════════════════════════════
        if (!isLoggedIn()) {
            window.location.href = 'login.html';
        }

        // Initialize Icons
        lucide.createIcons();

        // Logout Button
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                logout();
            }
        });

        // Load subscribers from localStorage (احتياط)
        function loadSubscribers() {
            try {
                const emails = JSON.parse(localStorage.getItem('ione_emails') || '[]');
                const countEl = document.getElementById('subscribersCount');
                const listEl = document.getElementById('subscribersList');
                
                if (countEl) countEl.textContent = emails.length;
                
                if (emails.length > 0 && listEl) {
                    listEl.innerHTML = `
                        <div style="padding: 12px; background: #f5f5f7; border-radius: 8px; font-family: monospace; font-size: 0.85rem; max-height: 300px; overflow-y: auto;">
                            ${emails.map((e, i) => `
                                <div style="padding: 8px; border-bottom: 1px solid #d2d2d7;">
                                    ${i + 1}. ${e.email} <span style="color:#6e6e73; font-size: 0.75rem;">(${new Date(e.timestamp).toLocaleString('ar-EG')})</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }
            } catch (e) {
                console.error('Load subscribers error:', e);
            }
        }

        // Calculate days until launch
        function updateDaysLeft() {
            const launchDate = new Date('2026-11-15T00:00:00+08:00').getTime();
            const now = Date.now();
            const daysLeft = Math.max(0, Math.floor((launchDate - now) / (1000 * 60 * 60 * 24)));
            const el = document.getElementById('daysLeft');
            if (el) el.textContent = daysLeft;
        }

        // Initialize
        loadSubscribers();
        updateDaysLeft();

        // Export button (مؤقت)
        document.getElementById('exportBtn').addEventListener('click', () => {
            alert('قريباً: تصدير Excel');
        });

        // Edit content button (مؤقت)
        document.getElementById('editContentBtn').addEventListener('click', (e) => {
            e.preventDefault();
            alert('قريباً: تعديل المحتوى');
        });

        // Clear cache
        document.getElementById('clearCacheBtn').addEventListener('click', (e) => {
            e.preventDefault();
            if (confirm('مسح الكاش؟')) {
                localStorage.removeItem('ione_emails');
                location.reload();
            }
        });

        console.log('%c Dashboard loaded ', 'background: #34C759; color: white; padding: 4px 8px; border-radius: 4px;');
    </script>
</body>
</html>
