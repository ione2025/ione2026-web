<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IONECENTER — Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="admin.css">
    <style>
        :root {
            --bg-main: #020205;
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.08);
        }
        
        body {
            margin: 0; padding: 0; box-sizing: border-box;
            background-color: var(--bg-main);
            font-family: 'Cairo', sans-serif;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* 🌟 حركة الخلفية (Animation) */
        .bg-animation {
            position: fixed; inset: 0; z-index: -1;
            background: linear-gradient(45deg, #020205, #0a0a15, #150520, #020205);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .top-bar {
            height: 70px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px; flex-shrink: 0;
        }
        
        .dashboard-container {
            flex: 1; padding: 10px 30px 30px 30px;
            display: flex; flex-direction: column; overflow: hidden;
        }

        .page-title {
            font-size: 1.6rem; font-weight: 800; margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: minmax(100px, 1fr);
            gap: 16px; flex: 1; overflow-y: auto;
        }

        .card-large { grid-column: span 2; grid-row: span 2; }
        .card-wide { grid-column: span 2; grid-row: span 1; }
        .card-tall { grid-column: span 1; grid-row: span 2; }
        .card-small { grid-column: span 1; grid-row: span 1; }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start;
            text-decoration: none; color: #fff; cursor: grab;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            position: relative; overflow: hidden;
        }
        
        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 12px 48px rgba(0,0,0,0.6);
        }
        .card:active { cursor: grabbing; }

        .card-icon-wrap {
            width: 48px; height: 48px; border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: auto;
            background: rgba(255,255,255,0.05);
        }

        .card i {
            font-size: 1.8rem;
            filter: drop-shadow(0 0 12px currentColor); /* 💡 إضاءة أقوى للأيقونة */
        }
        
        .card-title { font-size: 1.2rem; font-weight: 800; margin: 0; }
        .card-subtitle { font-size: 0.85rem; color: rgba(255,255,255,0.5); font-weight: 500; margin-top: 4px; }

        /* 🎨 الألوان المحسنة (نيون) */
        .card[data-id="orders"] i { color: #00F0FF; }
        .card[data-id="banks"] i { color: #34C759; }
        .card[data-id="vouchers"] i { color: #FF3B30; }
        .card[data-id="journal"] i { color: #FF9F0A; }
        .card[data-id="expenses"] i { color: #FF007F; }
        .card[data-id="suppliers"] i { color: #8B5CF6; }
        .card[data-id="customers"] i { color: #10B981; }
        .card[data-id="reports"] i { color: #F59E0B; }
        .card[data-id="status"] i { color: #6366F1; }
        .card[data-id="users"] i { color: #EC4899; }

        .btn {
            padding: 10px 20px; border-radius: 14px; border: 1px solid var(--glass-border);
            background: var(--glass-bg); color: #fff; cursor: pointer; font-family: inherit;
            backdrop-filter: blur(10px); transition: 0.2s; font-weight: 700; font-size: 0.9rem;
        }
        .btn:hover { background: rgba(255,255,255,0.1); }
        .sortable-ghost { opacity: 0.3; border: 2px dashed #00F0FF; }
    </style>
</head>
<body>
    <!-- حركة الخلفية -->
    <div class="bg-animation"></div>

    <div class="top-bar">
        <!-- 🖼️ الشعار الأصلي عاد -->
        <a href="../dashboard.html"><img src="../../assets/logo.png" alt="IONE CENTER" style="height: 45px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));"></a>
        
        <div style="display: flex; gap: 12px;">
            <button class="btn" onclick="saveLayout()">حفظ الترتيب</button>
            <button class="btn" onclick="logout()">خروج</button>
        </div>
    </div>

    <div class="dashboard-container">
        <h1 class="page-title">مرحباً، خليل 👋</h1>
        <div class="bento-grid" id="bentoGrid"></div>
    </div>

    <script src="admin.js"></script>
    <script>
        const defaultCards = [
            { id: 'orders', title: 'الطلبات', subtitle: 'إدارة طلبات العملاء', icon: 'shopping-bag', link: 'ordix/orders.html', size: 'card-large' },
            { id: 'banks', title: 'الصناديق', subtitle: 'الأرصدة والبنوك', icon: 'landmark', link: 'ordix/banks.html', size: 'card-small' },
            { id: 'vouchers', title: 'السندات', subtitle: 'قبض / صرف / تحويل', icon: 'receipt', link: 'ordix/vouchers.html', size: 'card-small' },
            { id: 'journal', title: 'دفتر اليوميات', subtitle: 'القيود المحاسبية', icon: 'book', link: 'ordix/journal.html', size: 'card-small' },
            { id: 'expenses', title: 'المصروفات', subtitle: 'مصاريف التشغيل', icon: 'trending-down', link: 'ordix/expenses.html', size: 'card-small' },
            { id: 'reports', title: 'التقارير', subtitle: 'تقارير مالية', icon: 'bar-chart-2', link: 'ordix/reports.html', size: 'card-wide' },
            { id: 'suppliers', title: 'الموردين', subtitle: 'قائمة الموردين', icon: 'factory', link: 'ordix/suppliers.html', size: 'card-tall' },
            { id: 'customers', title: 'العملاء', subtitle: 'قائمة العملاء', icon: 'users', link: 'ordix/customers.html', size: 'card-small' },
            { id: 'status', title: 'حالة النظام', subtitle: 'فحص الصفحات', icon: 'activity', link: 'status.html', size: 'card-small' },
            { id: 'users', title: 'المستخدمين', subtitle: 'إدارة الصلاحيات', icon: 'user-cog', link: 'users/list.html', size: 'card-small' }
        ];

        let savedLayout = [];

        async function loadLayout() {
            try {
                const token = localStorage.getItem('ione_admin_token');
                const res = await fetch('/api/dashboard/get', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                if (data.success && data.layout && data.layout.length > 0) { savedLayout = data.layout; } 
                else { savedLayout = defaultCards; }
            } catch(e) { savedLayout = defaultCards; }
            renderCards();
        }

        function renderCards() {
            const grid = document.getElementById('bentoGrid');
            grid.innerHTML = '';
            savedLayout.forEach(card => {
                const a = document.createElement('a');
                a.href = card.link;
                a.className = `card ${card.size}`;
                a.dataset.id = card.id;
                a.innerHTML = `
                    <div class="card-icon-wrap"><i data-lucide="${card.icon}"></i></div>
                    <h3 class="card-title">${card.title}</h3>
                    <span class="card-subtitle">${card.subtitle}</span>
                `;
                grid.appendChild(a);
            });
            if (window.lucide) lucide.createIcons();
            initSortable();
        }

        function initSortable() {
            new Sortable(document.getElementById('bentoGrid'), {
                animation: 200, ghostClass: 'sortable-ghost',
                onEnd: function() {
                    const newOrder = [];
                    document.querySelectorAll('.card').forEach(el => {
                        const card = savedLayout.find(c => c.id === el.dataset.id);
                        if (card) newOrder.push(card);
                    });
                    savedLayout = newOrder;
                }
            });
        }

        async function saveLayout() {
            const token = localStorage.getItem('ione_admin_token');
            try {
                const res = await fetch('/api/dashboard/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ layout: savedLayout })
                });
                const data = await res.json();
                if (data.success) { showToast('تم حفظ الترتيب بنجاح', 'success'); }
            } catch(e) { showToast('فشل الحفظ', 'error'); }
        }

        window.addEventListener('load', () => setTimeout(loadLayout, 100));
    </script>
</body>
</html>
