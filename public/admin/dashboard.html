<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IONECENTER — Dashboard Workspace</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <style>
        :root {
            --bg-body: #0b0c10;
            --bg-surface: rgba(18, 20, 28, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #8b5cf6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --sidebar-width: 380px;
            --notes-width: 340px;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--bg-body); 
            background-image: radial-gradient(circle at center, #151b29 0%, #0b0c10 100%); 
            color: var(--text-main); 
            height: 100vh; 
            overflow: hidden; 
            position: relative; 
            user-select: none; 
        }
        
        /* مساحة العمل الرئيسية */
        #workspace { 
            width: 100vw; 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            overflow: hidden; 
            z-index: 1; 
            padding: 20px 30px; 
        }
        
        /* شريط الأدوات العلوي (X) */
        .top-dashboard-drawer { position: fixed; top: 0; left: 0; right: 0; background: rgba(10, 11, 15, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); transform: translateY(-100%); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); z-index: 1000; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .top-dashboard-drawer.active { transform: translateY(0); }
        
        .drawer-nav { display: flex; justify-content: center; gap: 30px; flex: 1; }
        .user-profile-drawer { display: flex; align-items: center; gap: 12px; background: rgba(255, 255, 255, 0.03); padding: 6px 16px 6px 6px; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.08); cursor: pointer; transition: 0.3s; text-decoration: none; color: #fff; }
        .user-profile-drawer:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }
        .user-avatar-drawer { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-primary); box-shadow: 0 0 10px rgba(139, 92, 246, 0.4); }
        .user-info-drawer { display: flex; flex-direction: column; align-items: flex-start; }
        .user-name-drawer { font-size: 0.85rem; font-weight: 800; color: #fff; line-height: 1.2; }
        .user-role-drawer { font-size: 0.7rem; color: var(--accent-cyan); font-weight: 700; }
        
        .drawer-item { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #888; text-decoration: none; font-size: 0.75rem; font-weight: 700; transition: 0.3s; }
        .drawer-icon-wrap { width: 56px; height: 56px; border-radius: 16px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; transition: 0.3s; }
        .drawer-icon-wrap::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%; background: linear-gradient(to bottom, rgba(255,255,255,0.08), transparent); pointer-events: none; }
        .drawer-icon-wrap i { width: 24px; height: 24px; color: #d4d4d8; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); z-index: 1; }
        .drawer-item:hover { color: #fff; }
        .drawer-item:hover .drawer-icon-wrap { background: rgba(255, 255, 255, 0.08); border-color: rgba(255,255,255,0.2); transform: translateY(-3px); }

        /* الشريط الأيسر (الملاحظات) */
        .sidebar-left { width: var(--notes-width); height: calc(100vh - 30px); margin: 15px; background: var(--bg-surface); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 20px; position: fixed; right: 15px; top: 0; z-index: 100; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.6); transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.2s ease-in-out; }
        .sidebar-left.hidden { transform: translateX(calc(100% + 30px)); opacity: 0; pointer-events: none; }
        .sidebar-left.disabled { display: none; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-title { font-size: 1rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .btn-add-note { background: var(--accent-cyan); color: #fff; border: none; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(6, 182, 212, 0.4); transition: 0.2s; }
        .btn-add-note:hover { transform: scale(1.05); }
        .notes-dock { flex: 1; overflow-y: auto; padding: 15px 15px 20px 15px; display: flex; flex-direction: column; gap: 25px; }
        .notes-dock::-webkit-scrollbar { width: 4px; }
        .notes-dock::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }

        /* كارت الملاحظة */
        .note-card { position: relative; border-radius: 24px; background: #18181b; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.6); transition: transform 0.2s; z-index: 1; height: auto; }
        .note-card::before { content: ""; position: absolute; inset: -1.5px; border-radius: 25.5px; background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000); background-size: 400%; z-index: -1; animation: glowing 20s linear infinite; }
        @keyframes glowing { 0% { background-position: 0 0; } 50% { background-position: 400% 0; } 100% { background-position: 0 0; } }
        .note-card.docked { width: 100%; cursor: grab; }
        .note-card.floating { position: fixed; width: 320px; z-index: 9999; cursor: default; animation: popOut 0.3s ease; }
        @keyframes popOut { 0% { transform: scale(0.95); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
        .note-header { height: 40px; background: transparent; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; }
        .docked .note-header { cursor: grab; }
        .mac-dots { display: flex; gap: 6px; }
        .mac-dot { width: 10px; height: 10px; border-radius: 50%; }
        .mac-dot.red { background: #ff5f56; }
        .mac-dot.yellow { background: #ffbd2e; }
        .mac-dot.green { background: #27c93f; }
        .note-body { padding: 0 12px 12px 12px; flex: 1; display: flex; flex-direction: column; }
        .inner-box { background: #27272a; border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; flex: 1; }
        .note-card textarea { width: 100%; background: transparent; border: none; resize: none; outline: none; font-family: 'Cairo', sans-serif; font-size: 0.9rem; font-weight: 600; color: #fff; line-height: 1.6; margin-bottom: 10px; flex: none; min-height: 40px; overflow-y: hidden; }
        .note-card textarea::placeholder { color: rgba(255,255,255,0.3); }
        .inner-tools { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; flex-shrink: 0; }
        .btn-send-admin { display: flex; align-items: center; gap: 6px; background: rgba(16, 185, 129, 0.1); color: var(--accent-green); padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(16, 185, 129, 0.3); cursor: pointer; font-family: inherit; font-weight: 700; font-size: 0.75rem; transition: 0.2s; }
        .btn-send-admin:hover { background: rgba(16, 185, 129, 0.2); transform: translateY(-1px); }
        .btn-del-note { background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.3); display: flex; align-items: center; transition: 0.2s; }
        .btn-del-note:hover { color: #ef4444; transform: rotate(90deg); }

        /* الشريط الأيمن (المساعد) */
        .sidebar-right { width: var(--sidebar-width); height: calc(100vh - 30px); margin: 15px; background: var(--bg-surface); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 20px; position: fixed; left: 15px; top: 0; z-index: 100; display: flex; box-shadow: 0 20px 50px rgba(0,0,0,0.6); transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.2s ease-in-out; overflow: hidden; }
        .sidebar-right.hidden { transform: translateX(calc(-100% - 30px)); opacity: 0; pointer-events: none; }
        .sidebar-right.disabled { display: none; }
        .app-rail { width: 70px; background: rgba(0,0,0,0.3); display: flex; flex-direction: column; align-items: center; padding: 15px 0; gap: 15px; border-left: 1px solid var(--glass-border); border-radius: 0 20px 20px 0; }
        .rail-icon { width: 46px; height: 46px; border-radius: 12px; background: rgba(255,255,255,0.05); color: var(--text-muted); display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .rail-icon:hover { background: rgba(255,255,255,0.1); color: var(--text-main); transform: translateY(-2px); }
        .rail-icon.active { background: rgba(139, 92, 246, 0.2); color: var(--accent-primary); border-color: rgba(139, 92, 246, 0.4); }
        .rail-icon i { width: 22px; height: 22px; }
        .rail-divider { width: 30px; height: 1px; background: var(--glass-border); margin: 5px 0; }
        .btn-add-app { width: 40px; height: 40px; border-radius: 50%; border: 1px dashed var(--text-muted); background: transparent; color: var(--text-muted); display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; margin-top: auto; }
        .btn-add-app:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); transform: rotate(90deg); }
        .app-view { flex: 1; display: flex; flex-direction: column; border-radius: 20px 0 0 20px; }
        .app-header { height: 55px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--glass-border); }
        .app-title { font-size: 0.85rem; font-weight: 700; }
        .yt-search-container { padding: 10px; background: #000; display: none; border-bottom: 1px solid var(--glass-border); }
        .yt-search-container input { width: 100%; padding: 8px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; outline: none; font-family: 'Cairo', sans-serif; }
        .iframe-container { flex: 1; position: relative; background: #000; display: flex; flex-direction: column; }
        #app-iframe { width: 100%; flex: 1; border: none; display: none; }
        .app-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--text-muted); gap: 10px; }
        .guide-btn-wrapper { padding: 15px; border-top: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); }
        .guide-btn-gradient { width: 100%; padding: 12px 20px; border-radius: 50px; border: none; background: linear-gradient(90deg, #ff4e00 0%, #ec9f05 50%, #8bc34a 100%); color: #fff; font-family: inherit; font-size: 0.95rem; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 78, 0, 0.3); transition: transform 0.2s, box-shadow 0.2s; }
        .guide-btn-gradient:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255, 78, 0, 0.5); }

        /* =========================================
           لوحة التحكم (3 أقسام مرنة)
           ========================================= */
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--glass-border); flex-shrink: 0; }
        .page-title { font-size: 1.4rem; font-weight: 800; }
        
        .dashboard-sections {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 15px;
            min-height: 0;
        }

        .dropzone {
            display: flex;
            gap: 15px;
            min-height: 0;
            border: 1px dashed rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 5px;
            transition: background 0.3s;
        }
        .dropzone:hover { background: rgba(255,255,255,0.02); }

        .section-top { flex: 1.2; }
        .section-mid { flex: 1; }
        .section-bot { flex: 1; }

        .card {
            position: relative; border-radius: 20px; padding: 15px;
            display: flex; flex-direction: column; justify-content: space-between;
            text-decoration: none; color: #fff; cursor: grab; overflow: hidden;
            background: #18181b; backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s, background-image 0.3s;
            z-index: 1;
            flex: 1;
            width: 100%;
            background-size: cover;
            background-position: center;
        }
        
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 100%);
            pointer-events: none; z-index: -1;
        }

        /* 🌟 الخط الملون على الحافة اليسرى للبطاقة */
        .card::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0; left: 0; /* الحافة اليسرى */
            width: 5px;
            background-color: var(--card-accent, rgba(255,255,255,0.1)); /* سيتم تغييره حسب البطاقة */
            border-radius: 20px 0 0 20px; /* حواف دائرية من اليسار */
            z-index: 3;
        }

        .card:active { cursor: grabbing; }
        .card:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 15px 30px rgba(0,0,0,0.6), 0 0 15px rgba(139, 92, 246, 0.2);
            border-color: rgba(139, 92, 246, 0.4);
        }

        /* الشارة (Badge) في الزاوية */
        .card-badge {
            position: absolute; top: 15px; left: 15px;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            color: #fff; font-size: 0.75rem; font-weight: 800;
            padding: 2px 8px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 2;
        }

        /* الرقم البارز (Hero Stat) للبطاقات الكبيرة */
        .card-hero-stat {
            font-family: 'Inter', sans-serif;
            font-size: 2.5rem; font-weight: 800; line-height: 1;
            margin-top: auto; margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            z-index: 2;
        }

        .card-icon-wrap { 
            width: 42px; height: 42px; border-radius: 12px; display: flex; justify-content: center; align-items: center; 
            background: rgba(255, 255, 255, 0.03); margin-bottom: auto;
            border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 2;
        }
        .card i { width: 22px; height: 22px; filter: drop-shadow(0 0 8px currentColor); }
        
        .card-text-content { z-index: 2; }
        .card-title { font-size: 1rem; font-weight: 800; margin: 0; line-height: 1.2; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .card-subtitle { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; margin-top: 2px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

        /* الألوان المخصصة للخطوط والأيقونات */
        .card[data-id="orders"] { --card-accent: #00F0FF; } .card[data-id="orders"] .card-icon-wrap i, .card[data-id="orders"] .card-hero-stat { color: #00F0FF; }
        .card[data-id="banks"] { --card-accent: #34C759; } .card[data-id="banks"] .card-icon-wrap i { color: #34C759; }
        .card[data-id="vouchers"] { --card-accent: #FF3B30; } .card[data-id="vouchers"] .card-icon-wrap i { color: #FF3B30; }
        .card[data-id="journal"] { --card-accent: #FF9F0A; } .card[data-id="journal"] .card-icon-wrap i { color: #FF9F0A; }
        .card[data-id="expenses"] { --card-accent: #FF007F; } .card[data-id="expenses"] .card-icon-wrap i { color: #FF007F; }
        .card[data-id="suppliers"] { --card-accent: #8B5CF6; } .card[data-id="suppliers"] .card-icon-wrap i { color: #8B5CF6; }
        .card[data-id="customers"] { --card-accent: #10B981; } .card[data-id="customers"] .card-icon-wrap i { color: #10B981; }
        .card[data-id="reports"] { --card-accent: #F59E0B; } .card[data-id="reports"] .card-icon-wrap i { color: #F59E0B; }
        .card[data-id="status"] { --card-accent: #6366F1; } .card[data-id="status"] .card-icon-wrap i { color: #6366F1; }
        .card[data-id="users"] { --card-accent: #EC4899; } .card[data-id="users"] .card-icon-wrap i { color: #EC4899; }
        .card[data-id="settings"] { --card-accent: #9CA3AF; } .card[data-id="settings"] .card-icon-wrap i { color: #9CA3AF; }
        .card[data-id="purchases"] { --card-accent: #3B82F6; } .card[data-id="purchases"] .card-icon-wrap i { color: #3B82F6; }
        .card[data-id="sales"] { --card-accent: #14B8A6; } .card[data-id="sales"] .card-icon-wrap i { color: #14B8A6; }
        .card[data-id="team"] { --card-accent: #F43F5E; } .card[data-id="team"] .card-icon-wrap i { color: #F43F5E; }

        .sortable-ghost { opacity: 0.3; border: 2px dashed var(--accent-primary); background: rgba(139, 92, 246, 0.1); }

        /* أزرار إظهار/إخفاء الأشرطة */
        .toggle-btn { position: fixed; top: 50%; transform: translateY(-50%); background: var(--bg-surface); border: 1px solid var(--glass-border); color: var(--text-main); padding: 20px 10px; cursor: pointer; z-index: 101; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .toggle-right-side { right: 0; border-radius: 10px 0 0 10px; }
        .toggle-left-side { left: 0; border-radius: 0 10px 10px 0; }
        .toggle-btn:hover { background: var(--accent-primary); color: #fff; }
        .toggle-btn.disabled { display: none; }

        /* النوافذ (Controller & Guide & Customize) */
        .controller-overlay, .guide-overlay, .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 10000; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: 0.3s; }
        .controller-overlay.active, .guide-overlay.active, .modal-overlay.active { opacity: 1; visibility: visible; }
        .controller-box, .modal-box { background: #12141c; border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; width: 90%; max-width: 450px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); transform: translateY(20px) scale(0.95); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; }
        .controller-overlay.active .controller-box, .modal-overlay.active .modal-box { transform: translateY(0) scale(1); }
        .controller-box::before, .modal-box::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff); border-radius: 24px 24px 0 0; }
        .controller-header, .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .controller-title, .modal-title { font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .controller-options { display: flex; flex-direction: column; gap: 12px; }
        .controller-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 14px; transition: background 0.2s; }
        .controller-label { font-size: 0.95rem; font-weight: 600; color: #ccc; display: flex; align-items: center; gap: 10px; }
        .controller-label i { width: 18px; height: 18px; color: var(--accent-cyan); }
        .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #27272a; transition: .4s; border-radius: 34px; border: 1px solid rgba(255,255,255,0.1); }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: #888; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: rgba(16, 185, 129, 0.2); border-color: var(--accent-green); }
        input:checked + .slider:before { transform: translateX(20px); background-color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }

        .guide-overlay { align-items: flex-end; }
        .guide-box { background: #12141c; border: 1px solid rgba(255,255,255,0.1); border-bottom: none; border-radius: 24px 24px 0 0; width: 100%; max-width: 600px; padding: 30px; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); position: relative; }
        .guide-overlay.active .guide-box { transform: translateY(0); }
        .guide-box::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff); border-radius: 24px 24px 0 0; }
        .guide-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; color: #fff;}
        .guide-list { list-style: none; display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        .guide-item { display: flex; align-items: flex-start; gap: 12px; font-size: 0.95rem; color: var(--text-muted); line-height: 1.5; }
        .guide-item i { color: var(--accent-cyan); flex-shrink: 0; margin-top: 3px; }
        .guide-item kbd { background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 6px; font-family: 'Inter', monospace; font-weight: bold; color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .btn-guide-close { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: var(--accent-green); color: #fff; padding: 12px 24px; border-radius: 12px; font-weight: 700; z-index: 10001; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4); display: flex; align-items: center; gap: 8px; }
        .toast.show { bottom: 30px; }
        .app-list { display: flex; flex-direction: column; gap: 10px; }
        .app-item { display: flex; align-items: center; gap: 15px; padding: 12px; border-radius: 10px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); cursor: pointer; transition: 0.2s; }
        .app-item:hover { border-color: var(--text-muted); }
        .app-item.selected { border-color: var(--accent-primary); background: rgba(139, 92, 246, 0.1); }
        .app-item i { width: 24px; height: 24px; color: var(--text-muted); }
        .app-item.selected i { color: var(--accent-primary); }
        .app-item-info { flex: 1; }
        .app-item-title { font-weight: 700; font-size: 0.95rem; }
        .app-item-desc { font-size: 0.75rem; color: var(--text-muted); }
        
        @media (max-width: 1024px) {
            .section-top, .section-mid, .section-bot { flex-wrap: wrap; }
            .card { min-width: 45%; }
        }
        @media (max-width: 768px) {
            .dropzone { flex-direction: column; overflow-y: auto; }
            .card { min-width: 100%; height: 100px; }
            #workspace { padding: 10px; }
        }
    </style>
</head>
<body>

    <div class="toast" id="toast"><i data-lucide="check-circle"></i> تمت العملية بنجاح</div>

    <!-- شريط الأدوات العلوي -->
    <div class="top-dashboard-drawer" id="topDrawer">
        <a href="/admin/profile" class="user-profile-drawer">
            <div class="user-info-drawer">
                <div class="user-name-drawer" id="drawerUserName">Khalil CEO</div>
                <div class="user-role-drawer" id="drawerUserRole">Admin</div>
            </div>
            <img src="https://ui-avatars.com/api/?name=Khalil&background=8b5cf6&color=fff" alt="User" class="user-avatar-drawer" id="drawerUserAvatar">
        </a>
        <div class="drawer-nav">
            <a href="/admin/dashboard" class="drawer-item"><div class="drawer-icon-wrap"><i data-lucide="layout-dashboard"></i></div>الرئيسية</a>
            <a href="/admin/ordix/orders.html" class="drawer-item"><div class="drawer-icon-wrap"><i data-lucide="shopping-bag"></i></div>الطلبات</a>
            <a href="/admin/ordix/customers.html" class="drawer-item"><div class="drawer-icon-wrap"><i data-lucide="users"></i></div>العملاء</a>
            <a href="/admin/ordix/products.html" class="drawer-item"><div class="drawer-icon-wrap"><i data-lucide="package"></i></div>المنتجات</a>
            <a href="/admin/ordix/purchases.html" class="drawer-item"><div class="drawer-icon-wrap"><i data-lucide="file-text"></i></div>الفواتير</a>
            <a href="/admin/ordix/settings.html" class="drawer-item"><div class="drawer-icon-wrap"><i data-lucide="settings"></i></div>الإعدادات</a>
        </div>
        <div style="width: 150px;"></div>
    </div>

    <!-- لوحة التحكم -->
    <div class="controller-overlay" id="controllerOverlay" onclick="closeControllerOnOverlay(event)">
        <div class="controller-box" onclick="event.stopPropagation()">
            <div class="controller-header">
                <div class="controller-title"><i data-lucide="settings-2"></i> لوحة التحكم</div>
                <button onclick="closeController()" style="background:none; border:none; color:#888; cursor:pointer;"><i data-lucide="x"></i></button>
            </div>
            <div class="controller-options" id="controllerOptions"></div>
            <button class="btn-guide-close" onclick="clearAllBackgrounds()" style="margin-top: 15px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); box-shadow: none; color: #ef4444;">إزالة خلفيات البطاقات</button>
            <button class="btn-guide-close" onclick="closeController()" style="margin-top: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); box-shadow: none;">إغلاق اللوحة</button>
        </div>
    </div>

    <!-- نافذة الدليل -->
    <div class="guide-overlay" id="guideOverlay" onclick="closeGuideOnOverlay(event)">
        <div class="guide-box" onclick="event.stopPropagation()">
            <div class="guide-title"><i data-lucide="sparkles"></i> مرحباً بك في مساحة العمل</div>
            <ul class="guide-list" id="guideList"></ul>
            <button class="btn-guide-close" onclick="closeGuide()">ابدأ العمل الآن</button>
        </div>
    </div>

    <!-- نافذة تخصيص التطبيقات -->
    <div class="modal-overlay" id="customizeModal" onclick="closeCustomizeModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title">إدارة التطبيقات</div>
                <button onclick="closeCustomizeModal(event)" style="background:none; border:none; color:#888; cursor:pointer;"><i data-lucide="x"></i></button>
            </div>
            <div class="app-list" id="appList"></div>
        </div>
    </div>

    <button class="toggle-btn toggle-right-side" onclick="toggleLeftSidebar()" id="btnToggleLeft" style="opacity: 1;"><i data-lucide="sticky-note"></i></button>
    <button class="toggle-btn toggle-left-side" onclick="toggleRightSidebar()" id="btnToggleRight" style="opacity: 1;"><i data-lucide="layout-sidebar"></i></button>

    <!-- الشريط الأيسر (الملاحظات) -->
    <div class="sidebar-left hidden" id="sidebarLeft">
        <div class="sidebar-header">
            <div class="sidebar-title"><i data-lucide="sticky-note"></i> الملاحظات</div>
            <button class="btn-add-note" onclick="addNewNote()"><i data-lucide="plus" style="width:16px;"></i></button>
        </div>
        <div class="notes-dock" id="notesDock"></div>
    </div>

    <!-- الشريط الأيمن (المساعد) -->
    <div class="sidebar-right hidden" id="sidebarRight">
        <div class="app-rail" id="appRail">
            <div class="rail-divider"></div>
            <button class="btn-add-app" onclick="openCustomizeModal()" title="إضافة تطبيق"><i data-lucide="plus"></i></button>
        </div>
        <div class="app-view">
            <div class="app-header">
                <div class="app-title" id="appTitle">المساعد الجانبي</div>
                <button class="modal-close" onclick="toggleRightSidebar()" style="background:none; border:none; color:var(--text-muted); cursor:pointer;"><i data-lucide="x"></i></button>
            </div>
            <div class="yt-search-container" id="ytSearchContainer">
                <input type="text" id="ytSearchInput" placeholder="ابحث في يوتيوب (يفتح في تبويب جديد)..." onkeydown="if(event.key==='Enter') searchYouTube()">
            </div>
            <div class="iframe-container">
                <div class="app-placeholder" id="appPlaceholder">
                    <i data-lucide="mouse-pointer-2" style="width:30px; height:30px; opacity:0.5;"></i>
                    <span style="font-size:0.8rem;">اختر تطبيقاً</span>
                </div>
                <iframe id="app-iframe" allow="autoplay; encrypted-media;"></iframe>
            </div>
            <div class="guide-btn-wrapper">
                <button class="guide-btn-gradient" onclick="openGuide()">
                    <i data-lucide="sparkles"></i> دليل الاستخدام
                </button>
            </div>
        </div>
    </div>

    <!-- مساحة العمل (لوحة التحكم Bento) -->
    <div id="workspace" ondblclick="toggleAllTools(event)">
        <div class="dashboard-header">
            <h1 class="page-title">مرحباً بك في لوحة التحكم</h1>
        </div>
        
        <div class="dashboard-sections" id="bentoGrid">
            <div class="dropzone section-top" id="section-top" data-section="top"></div>
            <div class="dropzone section-mid" id="section-mid" data-section="mid"></div>
            <div class="dropzone section-bot" id="section-bot" data-section="bot"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // =========================================
        // 1. بيانات المستخدم
        // =========================================
        let userRole = localStorage.getItem('userRole') || 'admin'; 
        let currentUser = {
            name: localStorage.getItem('userName') || "Khalil CEO",
            role: localStorage.getItem('userRoleName') || "Admin",
            avatar: localStorage.getItem('userAvatar') || "https://ui-avatars.com/api/?name=Khalil&background=8b5cf6&color=fff"
        };
        document.getElementById('drawerUserName').innerText = currentUser.name;
        document.getElementById('drawerUserRole').innerText = currentUser.role;
        document.getElementById('drawerUserAvatar').src = currentUser.avatar;

        // =========================================
        // 2. مصفوفة البطاقات (مع الأرقام والإحصائيات)
        // =========================================
        const APP_PAGES = [
            { id: 'orders', title: 'الطلبات', subtitle: 'إدارة طلبات العملاء', icon: 'shopping-bag', link: 'ordix/orders.html', section: 'top', count: 10, countLabel: 'طلب جديد' },
            { id: 'purchases', title: 'فواتير الشراء', subtitle: 'فواتير الموردين (PR)', icon: 'shopping-cart', link: 'ordix/purchases.html', section: 'mid', count: 5, countLabel: 'فاتورة معلقة' },
            { id: 'sales', title: 'فواتير البيع', subtitle: 'فواتير العملاء (S)', icon: 'dollar-sign', link: 'ordix/sales.html', section: 'mid', count: 20, countLabel: 'فاتورة جديدة' },
            { id: 'customers', title: 'العملاء', subtitle: 'قائمة العملاء', icon: 'users', link: 'ordix/customers.html', section: 'top', count: 150, countLabel: 'عميل مسجل' },
            { id: 'banks', title: 'الصناديق', subtitle: 'الأرصدة والبنوك', icon: 'landmark', link: 'ordix/banks.html', section: 'bot', count: 3, countLabel: 'حساب بنكي' },
            { id: 'vouchers', title: 'السندات', subtitle: 'قبض / صرف / تحويل', icon: 'receipt', link: 'ordix/vouchers.html', section: 'bot', count: 12, countLabel: 'سند اليوم' },
            { id: 'journal', title: 'دفتر اليوميات', subtitle: 'القيود المحاسبية', icon: 'book', link: 'ordix/journal.html', section: 'bot', count: 45, countLabel: 'قيد محاسبي' },
            { id: 'expenses', title: 'المصروفات', subtitle: 'مصاريف التشغيل', icon: 'trending-down', link: 'ordix/expenses.html', section: 'bot', count: 8, countLabel: 'مصروف جديد' },
            { id: 'reports', title: 'التقارير', subtitle: 'تقارير مالية', icon: 'bar-chart-2', link: 'ordix/reports.html', section: 'bot', count: 4, countLabel: 'تقرير متاح' },
            { id: 'suppliers', title: 'الموردين', subtitle: 'قائمة الموردين', icon: 'factory', link: 'ordix/suppliers.html', section: 'bot', count: 25, countLabel: 'مورد' },
            { id: 'status', title: 'حالة النظام', subtitle: 'فحص الصفحات', icon: 'activity', link: 'status.html', section: 'bot', count: 2, countLabel: 'تنبيه نشط' },
            { id: 'users', title: 'المستخدمين', subtitle: 'إدارة الصلاحيات', icon: 'user-cog', link: 'users/list.html', section: 'bot', count: 6, countLabel: 'مستخدم' },
            { id: 'settings', title: 'الإعدادات', subtitle: 'بيانات الشركة', icon: 'settings', link: 'ordix/settings.html', section: 'bot' }
        ];

        let savedBgs = JSON.parse(localStorage.getItem('cardBackgrounds') || '{}');

        function renderCards() {
            document.getElementById('section-top').innerHTML = '';
            document.getElementById('section-mid').innerHTML = '';
            document.getElementById('section-bot').innerHTML = '';

            APP_PAGES.forEach(card => {
                const a = document.createElement('a');
                a.href = card.link;
                a.className = `card`;
                a.dataset.id = card.id;
                
                if (savedBgs[card.id]) {
                    a.style.backgroundImage = `linear-gradient(rgba(10, 11, 15, 0.7), rgba(10, 11, 15, 0.7)), url(${savedBgs[card.id]})`;
                }

                let cardContent = `
                    <div class="card-icon-wrap"><i data-lucide="${card.icon}"></i></div>
                `;

                if (card.id === 'orders') {
                    cardContent += `
                        <div class="card-hero-stat">${card.count}</div>
                        <div class="card-text-content">
                            <h3 class="card-title">${card.title}</h3>
                            <span class="card-subtitle">${card.subtitle}</span>
                        </div>
                    `;
                } else {
                    if (card.count) {
                        a.innerHTML += `<div class="card-badge">${card.count}</div>`;
                    }
                    cardContent += `
                        <div class="card-text-content">
                            <h3 class="card-title">${card.title}</h3>
                            <span class="card-subtitle">${card.subtitle}</span>
                        </div>
                    `;
                }

                a.innerHTML += cardContent;
                document.getElementById(`section-${card.section}`).appendChild(a);
            });
            
            if (window.lucide) lucide.createIcons();
            initSortableGrid();
        }

        function initSortableGrid() {
            const sections = document.querySelectorAll('.dropzone');
            sections.forEach(sec => {
                new Sortable(sec, {
                    group: 'shared', 
                    animation: 200, 
                    ghostClass: 'sortable-ghost',
                    onAdd: function (evt) {
                        lucide.createIcons();
                    }
                });
            });
        }

        // =========================================
        // 3. إضافة خلفية بالزر الأيمن (Right Click)
        // =========================================
        document.getElementById('bentoGrid').addEventListener('contextmenu', function(e) {
            const card = e.target.closest('.card');
            if (!card) return;
            e.preventDefault();
            
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*';
            
            fileInput.onchange = (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (r) => {
                        const base64Image = r.target.result;
                        card.style.backgroundImage = `linear-gradient(rgba(10, 11, 15, 0.7), rgba(10, 11, 15, 0.7)), url(${base64Image})`;
                        savedBgs[card.dataset.id] = base64Image;
                        localStorage.setItem('cardBackgrounds', JSON.stringify(savedBgs));
                        showToast('تم تحديث خلفية البطاقة');
                    };
                    reader.readAsDataURL(file);
                }
            };
            fileInput.click();
        });

        function clearAllBackgrounds() {
            localStorage.removeItem('cardBackgrounds');
            savedBgs = {};
            renderCards();
            closeController();
            showToast('تمت إزالة جميع الخلفيات');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerHTML = `<i data-lucide="check-circle"></i> ${msg}`;
            lucide.createIcons();
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // =========================================
        // 4. المساعد الجانبي
        // =========================================
        const AVAILABLE_APPS = [
            { id: 'youtube', name: 'YouTube', desc: 'مشاهدة الفيديوهات', icon: 'youtube', url: 'https://www.youtube.com/embed/videoseries?list=PLx0sYbCqOb8TBPRdmBHs5Iftvv9TPboYG' },
            { id: 'whatsapp', name: 'WhatsApp', desc: 'محادثات العمل', icon: 'message-circle', url: 'https://web.whatsapp.com/' }
        ];
        let userApps = JSON.parse(localStorage.getItem('userApps')) || ['youtube', 'whatsapp'];
        let activeApp = localStorage.getItem('activeApp') || null;
        const iframe = document.getElementById('app-iframe');
        const placeholder = document.getElementById('appPlaceholder');
        const appTitle = document.getElementById('appTitle');
        const appRail = document.getElementById('appRail');
        const ytSearchContainer = document.getElementById('ytSearchContainer');
        let whatsappWindow = null;

        function renderRail() {
            appRail.querySelectorAll('.rail-icon').forEach(el => el.remove());
            userApps.forEach(appId => {
                const app = AVAILABLE_APPS.find(a => a.id === appId);
                if (!app) return;
                const btn = document.createElement('div');
                btn.className = `rail-icon ${activeApp === app.id ? 'active' : ''}`;
                btn.innerHTML = `<i data-lucide="${app.icon}"></i>`;
                btn.onclick = () => loadApp(app.id, app.url, app.name);
                appRail.insertBefore(btn, appRail.querySelector('.rail-divider'));
            });
            lucide.createIcons();
        }

        function loadApp(id, url, name) {
            activeApp = id;
            localStorage.setItem('activeApp', id);
            renderRail();
            ytSearchContainer.style.display = id === 'youtube' ? 'block' : 'none';
            placeholder.style.display = 'none';
            iframe.style.display = 'block';
            appTitle.innerText = name;

            if (id === 'whatsapp') {
                if (whatsappWindow && !whatsappWindow.closed) whatsappWindow.focus();
                else whatsappWindow = window.open(url, 'WhatsAppPopup', 'width=900,height=700');
                iframe.style.display = 'none';
                placeholder.style.display = 'flex';
                return;
            }
            iframe.src = url;
        }

        function searchYouTube() {
            const query = document.getElementById('ytSearchInput').value.trim();
            if(!query) return;
            window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`, '_blank');
        }

        function openCustomizeModal() {
            const listContainer = document.getElementById('appList');
            listContainer.innerHTML = '';
            AVAILABLE_APPS.forEach(app => {
                const isSelected = userApps.includes(app.id);
                const item = document.createElement('div');
                item.className = `app-item ${isSelected ? 'selected' : ''}`;
                item.innerHTML = `
                    <i data-lucide="${app.icon}"></i>
                    <div class="app-item-info"><div class="app-item-title">${app.name}</div><div class="app-item-desc">${app.desc}</div></div>
                    ${isSelected ? '<i data-lucide="check-circle" style="color:var(--accent-primary);"></i>' : ''}
                `;
                item.onclick = () => toggleAppSelection(app.id);
                listContainer.appendChild(item);
            });
            lucide.createIcons();
            document.getElementById('customizeModal').classList.add('active');
        }

        function closeCustomizeModal(e) {
            if (!e || e.target.id === 'customizeModal' || e.target.closest('.modal-close')) {
                document.getElementById('customizeModal').classList.remove('active');
            }
        }

        function toggleAppSelection(appId) {
            if (userApps.includes(appId)) {
                userApps = userApps.filter(id => id !== appId);
                if (activeApp === appId) {
                    activeApp = null; localStorage.removeItem('activeApp');
                    iframe.style.display = 'none'; placeholder.style.display = 'flex'; ytSearchContainer.style.display = 'none'; appTitle.innerText = 'المساعد الجانبي';
                }
            } else { userApps.push(appId); }
            localStorage.setItem('userApps', JSON.stringify(userApps));
            renderRail(); openCustomizeModal(); 
        }

        if (activeApp) {
            const app = AVAILABLE_APPS.find(a => a.id === activeApp);
            if (app) loadApp(app.id, app.url, app.name);
        } else { renderRail(); }

        // =========================================
        // 5. الدليل ولوحة التحكم
        // =========================================
        let guideData = [
            { icon: 'mouse-pointer-2', title: 'الخلفيات:', desc: 'اضغط <b>بالزر الأيمن</b> على أي بطاقة لاختيار صورة خلفية.' },
            { icon: 'settings-2', title: 'لوحة التحكم:', desc: 'اضغط <kbd>C</kbd> لفتح لوحة التحكم وإزالة الخلفيات.' },
            { icon: 'sticky-note', title: 'الملاحظات:', desc: 'اسحب الكارت لتعويمه. انقر <b>نقرتين</b> لإعادته.' },
            { icon: 'keyboard', title: 'اختصار Z:', desc: 'اضغط <kbd>Z</kbd> لإرجاع الملاحظات.' }
        ];
        let controllerSettings = [
            { id: 'toggleNotes', label: 'شريط الملاحظات (اليمين)', icon: 'sticky-note', target: 'sidebarLeft', btnTarget: 'btnToggleLeft', isOn: true },
            { id: 'toggleAssistant', label: 'شريط المساعد (اليسار)', icon: 'layout-sidebar', target: 'sidebarRight', btnTarget: 'btnToggleRight', isOn: true }
        ];

        function renderGuide() {
            const list = document.getElementById('guideList'); list.innerHTML = '';
            guideData.forEach(item => {
                const li = document.createElement('li'); li.className = 'guide-item';
                li.innerHTML = `<i data-lucide="${item.icon}"></i><div><b>${item.title}</b> ${item.desc}</div>`;
                list.appendChild(li);
            }); lucide.createIcons();
        }
        renderGuide();

        function renderController() {
            const container = document.getElementById('controllerOptions'); container.innerHTML = ''; 
            if (userRole !== 'admin') { document.getElementById('controllerOverlay').remove(); return; }
            controllerSettings.forEach((setting) => {
                const row = document.createElement('div'); row.className = 'controller-row';
                row.innerHTML = `
                    <div class="controller-label"><i data-lucide="${setting.icon}"></i> ${setting.label}</div>
                    <label class="switch"><input type="checkbox" id="${setting.id}" ${setting.isOn ? 'checked' : ''}><span class="slider"></span></label>
                `;
                const checkbox = row.querySelector(`#${setting.id}`);
                checkbox.addEventListener('change', (e) => {
                    toggleSidebarDynamically(setting.target, setting.btnTarget, e.target.checked);
                    setting.isOn = e.target.checked;
                });
                container.appendChild(row);
            }); lucide.createIcons();
        }
        renderController();

        function toggleSidebarDynamically(targetId, btnId, isOn) {
            userInteracted = true;
            const bar = document.getElementById(targetId); const btn = document.getElementById(btnId);
            if (isOn) { bar.classList.remove('disabled', 'hidden'); btn.classList.remove('disabled'); btn.style.opacity = '0'; }
            else { bar.classList.add('disabled', 'hidden'); btn.classList.add('disabled'); }
        }

        // =========================================
        // 6. العرض التلقائي والتحكم
        // =========================================
        let userInteracted = false; 
        window.addEventListener('load', () => {
            const leftBar = document.getElementById('sidebarLeft'); const rightBar = document.getElementById('sidebarRight');
            const btnLeft = document.getElementById('btnToggleLeft'); const btnRight = document.getElementById('btnToggleRight');
            setTimeout(() => {
                if (userInteracted || !controllerSettings.find(s => s.id === 'toggleNotes')?.isOn) return;
                leftBar.classList.remove('hidden'); rightBar.classList.remove('hidden');
                btnLeft.style.opacity = '0'; btnRight.style.opacity = '0';
            }, 200);
            setTimeout(() => {
                if (userInteracted || !controllerSettings.find(s => s.id === 'toggleNotes')?.isOn) return;
                leftBar.classList.add('hidden'); rightBar.classList.add('hidden');
                btnLeft.style.opacity = '1'; btnRight.style.opacity = '1';
            }, 2500);
            renderCards();
        });

        function openGuide() { document.getElementById('guideOverlay').classList.add('active'); }
        function closeGuide() { document.getElementById('guideOverlay').classList.remove('active'); }
        function closeGuideOnOverlay(e) { if(e.target.id === 'guideOverlay') closeGuide(); }
        function openController() { document.getElementById('controllerOverlay').classList.add('active'); }
        function closeController() { document.getElementById('controllerOverlay').classList.remove('active'); }
        function closeControllerOnOverlay(e) { if(e.target.id === 'controllerOverlay') closeController(); }
        const sidebarLeft = document.getElementById('sidebarLeft'); const sidebarRight = document.getElementById('sidebarRight');
        function toggleLeftSidebar() { userInteracted = true; sidebarLeft.classList.toggle('hidden'); document.getElementById('btnToggleLeft').style.opacity = sidebarLeft.classList.contains('hidden') ? '1' : '0'; }
        function toggleRightSidebar() { userInteracted = true; sidebarRight.classList.toggle('hidden'); document.getElementById('btnToggleRight').style.opacity = sidebarRight.classList.contains('hidden') ? '1' : '0'; }
        function toggleAllTools(e) {
            if(e.target.closest('.sidebar-left') || e.target.closest('.sidebar-right') || e.target.closest('.note-card') || e.target.closest('.toggle-btn') || e.target.closest('.guide-trigger') || e.target.closest('.top-dashboard-drawer') || e.target.closest('.controller-overlay')) return;
            userInteracted = true; sidebarLeft.classList.toggle('hidden'); sidebarRight.classList.toggle('hidden');
            document.getElementById('btnToggleLeft').style.opacity = sidebarLeft.classList.contains('hidden') ? '1' : '0';
            document.getElementById('btnToggleRight').style.opacity = sidebarRight.classList.contains('hidden') ? '1' : '0';
        }

        // =========================================
        // 7. الملاحظات
        // =========================================
        const notesDock = document.getElementById('notesDock'); let zIndexCounter = 100;
        function autoResize(textarea) { textarea.style.height = 'auto'; textarea.style.height = textarea.scrollHeight + 'px'; }
        function addNewNote() {
            const note = document.createElement('div'); note.className = 'note-card docked'; note.style.zIndex = ++zIndexCounter;
            note.innerHTML = `
                <div class="note-header"><div class="mac-dots"><div class="mac-dot red"></div><div class="mac-dot yellow"></div><div class="mac-dot green"></div></div><button class="btn-del-note" onclick="this.closest('.note-card').remove()"><i data-lucide="x" style="width:16px;"></i></button></div>
                <div class="note-body"><div class="inner-box"><textarea placeholder="اكتب ملاحظتك للأدمن..." ondblclick="event.stopPropagation()"></textarea><div class="inner-tools"><button class="btn-send-admin" onclick="sendToAdmin(this)"><i data-lucide="send" style="width:14px;"></i> إرسال للأدمن</button></div></div></div>
            `;
            notesDock.appendChild(note); lucide.createIcons();
            const textarea = note.querySelector('textarea'); textarea.addEventListener('input', function() { autoResize(this); }); setupNoteDrag(note);
        }
        async function sendToAdmin(btn) {
            const noteCard = btn.closest('.note-card'); const textarea = noteCard.querySelector('textarea'); const text = textarea.value.trim();
            if(!text) { alert('الرجاء كتابة ملاحظة قبل الإرسال.'); return; }
            const originalText = btn.innerHTML; btn.innerHTML = '<i data-lucide="loader" class="spin" style="width:14px;"></i> جاري الإرسال...'; lucide.createIcons();
            try {
                const response = await fetch('/api/status/notes/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ page: window.location.pathname, notes: text, sender: currentUser.name }) });
                const data = await response.json();
                if (data.success) { showToast('تم إرسال الملاحظة للأدمن'); textarea.value = ''; autoResize(textarea); }
                else { alert('حدث خطأ في الخادم: ' + data.error); }
            } catch (e) { alert('فشل الاتصال بالخادم.'); } finally { btn.innerHTML = originalText; lucide.createIcons(); }
        }
        function setupNoteDrag(note) {
            let isDragging = false, startX, startY, startLeft, startTop;
            const header = note.querySelector('.note-header'); const textarea = note.querySelector('textarea');
            header.addEventListener('mousedown', (e) => {
                if(e.target.closest('.btn-del-note')) return; e.preventDefault(); isDragging = true; note.style.zIndex = ++zIndexCounter;
                if (note.classList.contains('docked')) { note.classList.remove('docked'); note.classList.add('floating'); const rect = note.getBoundingClientRect(); note.style.left = rect.left + 'px'; note.style.top = rect.top + 'px'; document.body.appendChild(note); }
                startX = e.clientX; startY = e.clientY; startLeft = parseInt(window.getComputedStyle(note).left, 10) || note.offsetLeft; startTop = parseInt(window.getComputedStyle(note).top, 10) || note.offsetTop;
                document.addEventListener('mousemove', onMouseMove); document.addEventListener('mouseup', onMouseUp);
            });
            function onMouseMove(e) { if (!isDragging) return; note.style.left = (startLeft + e.clientX - startX) + 'px'; note.style.top = (startTop + e.clientY - startY) + 'px'; }
            function onMouseUp() { isDragging = false; document.removeEventListener('mousemove', onMouseMove); document.removeEventListener('mouseup', onMouseUp); }
            note.addEventListener('dblclick', (e) => { if(e.target === textarea) return; dockNote(note); });
            textarea.addEventListener('dblclick', (e) => e.stopPropagation()); header.addEventListener('dblclick', (e) => e.stopPropagation());
        }
        function dockNote(note) { note.classList.remove('floating'); note.classList.add('docked'); note.style.left = ''; note.style.top = ''; notesDock.appendChild(note); }
        setTimeout(() => { addNewNote(); }, 300);

        // 8. الاختصارات
        document.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT') return;
            if (e.key.toLowerCase() === 'z') document.querySelectorAll('.note-card.floating').forEach(dockNote);
            if (e.key.toLowerCase() === 'x') document.getElementById('topDrawer').classList.toggle('active');
            if (e.key.toLowerCase() === 'c' && userRole === 'admin') {
                const overlay = document.getElementById('controllerOverlay'); if(overlay) overlay.classList.contains('active') ? closeController() : openController();
            }
        });
    </script>
</body>
</html>
