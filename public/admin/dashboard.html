<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IONECENTER — Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="admin.css">
    <style>
        /* الألوان الأساسية المستوحاة من الصور */
        :root {
            --bg-main: #0a0a0f;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
        }
        
        body {
            margin: 0; padding: 0; box-sizing: border-box;
            background-color: var(--bg-main);
            /* توهج خلفي خفيف */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 150, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.04) 0%, transparent 60%);
            font-family: 'Cairo', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column;
        }

        .top-bar {
            height: 64px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px; flex-shrink: 0;
        }
        
        .dashboard-container {
            flex: 1; padding: 10px 30px 30px 30px;
            display: flex; flex-direction: column;
        }

        .page-title {
            font-size: 1.4rem; font-weight: 800; margin-bottom: 20px;
            color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        /* الشبكة: Flexbox يمنع التمدد العمودي غير المرغوب */
        .cards-grid {
            display: flex; flex-wrap: wrap; gap: 16px;
            justify-content: flex-start; /* يبدأ من اليمين في RTL */
        }

        /* الكرت الزجاجي */
        .card {
            flex: 1 1 180px; /* مرن، ولكن بحد أدنى 180px */
            max-width: 240px; /* حد أقصى لمنع التمدد */
            min-height: 140px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-decoration: none; color: var(--text-main); cursor: grab;
            transition: all 0.3s ease;
            position: relative; overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: rgba(255,255,255,0.25);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }
        .card:active { cursor: grabbing; }

        .card i {
            font-size: 2.4rem; margin-bottom: 14px;
            /* التوهج المحيط بالأيقونة */
            filter: drop-shadow(0 0 12px currentColor); 
        }
        .card h3 { font-size: 1rem; font-weight: 700; margin: 0; letter-spacing: 0.5px; }

        /* ألوان مخصصة لكل كرت (مستوحاة من الصور) */
        .card[data-id="orders"] i { color: #00F0FF; }
        .card[data-id="banks"] i { color: #34C759; }
        .card[data-id="vouchers"] i { color: #FF3B30; }
        .card[data-id="journal"] i { color: #FF9F0A; }
        .card[data-id="expenses"] i { color: #FF007F; }
        .card[data-id="suppliers"] i { color: #8B5CF6; }
        .card[data-id="customers"] i { color: #10B981; }
        .card[data-id="reports"] i { color: #F59E0B; }
        .card[data-id="status"] i { color: #6366F1; }
        .card[data-id="users"] i { color: #EC4899; }

        /* تأثير السحب */
        .sortable-ghost {
            opacity: 0.4; background: rgba(255,255,255,0.1);
            border: 2px dashed rgba(255,255,255,0.5);
        }
        
        /* أزرار أعلى الصفحة */
        .btn {
            padding: 8px 16px; border-radius: 12px; border: 1px solid var(--glass-border);
            background: var(--glass-bg); color: white; cursor: pointer; font-family: inherit;
            backdrop-filter: blur(10px); transition: 0.2s; font-weight: 700;
        }
        .btn:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div class="top-bar">
        <div style="font-size: 1.4rem; font-weight: 800; text-shadow: 0 0 10px rgba(255,255,255,0.3);">IONE<span style="color:#E31E24">+</span></div>
        <div style="display: flex; gap: 10px;">
            <button class="btn" onclick="saveLayout()">حفظ الترتيب</button>
            <button class="btn" onclick="logout()">خروج</button>
        </div>
    </div>

    <div class="dashboard-container">
        <h1 class="page-title">لوحة التحكم</h1>
        <div class="cards-grid" id="cardsGrid"></div>
    </div>

    <script src="admin.js"></script>
    <script>
        const defaultCards = [
            { id: 'orders', title: 'الطلبات', icon: 'shopping-bag', link: 'ordix/orders.html' },
            { id: 'banks', title: 'الصناديق', icon: 'landmark', link: 'ordix/banks.html' },
            { id: 'vouchers', title: 'السندات', icon: 'receipt', link: 'ordix/vouchers.html' },
            { id: 'journal', title: 'دفتر اليوميات', icon: 'book', link: 'ordix/journal.html' },
            { id: 'expenses', title: 'المصروفات', icon: 'trending-down', link: 'ordix/expenses.html' },
            { id: 'suppliers', title: 'الموردين', icon: 'factory', link: 'ordix/suppliers.html' },
            { id: 'customers', title: 'العملاء', icon: 'users', link: 'ordix/customers.html' },
            { id: 'reports', title: 'التقارير', icon: 'bar-chart-2', link: 'ordix/reports.html' },
            { id: 'status', title: 'حالة النظام', icon: 'activity', link: 'status.html' },
            { id: 'users', title: 'المستخدمين', icon: 'user-cog', link: 'users/list.html' }
        ];

        let savedLayout = [];

        async function loadLayout() {
            try {
                const token = localStorage.getItem('ione_admin_token');
                const res = await fetch('/api/dashboard/get', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                if (data.success && data.layout && data.layout.length > 0) { savedLayout = data.layout; } 
                else { savedLayout = defaultCards; }
            } catch(e) { savedLayout = defaultCards; }
            renderCards();
        }

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';
            savedLayout.forEach(card => {
                const a = document.createElement('a');
                a.href = card.link;
                a.className = 'card';
                a.dataset.id = card.id;
                a.innerHTML = `<i data-lucide="${card.icon}"></i><h3>${card.title}</h3>`;
                grid.appendChild(a);
            });
            if (window.lucide) lucide.createIcons();
            initSortable();
        }

        function initSortable() {
            new Sortable(document.getElementById('cardsGrid'), {
                animation: 200, ghostClass: 'sortable-ghost',
                onEnd: function() {
                    const newOrder = [];
                    document.querySelectorAll('.card').forEach(el => {
                        const card = savedLayout.find(c => c.id === el.dataset.id);
                        if (card) newOrder.push(card);
                    });
                    savedLayout = newOrder;
                }
            });
        }

        async function saveLayout() {
            const token = localStorage.getItem('ione_admin_token');
            try {
                const res = await fetch('/api/dashboard/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ layout: savedLayout })
                });
                const data = await res.json();
                if (data.success) { showToast('تم حفظ الترتيب بنجاح', 'success'); }
            } catch(e) { showToast('فشل الحفظ', 'error'); }
        }

        window.addEventListener('load', () => setTimeout(loadLayout, 100));
    </script>
</body>
</html>
