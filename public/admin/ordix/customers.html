<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IONECENTER - Customers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="../admin.css">
    <style>
        :root { --bg-dark: #050508; --text: #ffffff; --text-muted: #a1a1aa; --vip: #10b981; --active: #f59e0b; --new: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); background-image: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.1) 0%, transparent 50%); color: var(--text); padding: 20px; min-height: 100vh; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 1.8rem; font-weight: 800; }
        .btn-add { background: #3b82f6; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 700; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-add:hover { background: #2563eb; transform: translateY(-2px); }

        .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-family: inherit; font-size: 0.9rem; font-weight: 600; transition: 0.2s; }
        .filter-btn.active { background: #3b82f6; border-color: #3b82f6; color: white; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }

        .cards-row { display: grid; gap: 20px; min-height: 100px; margin-bottom: 30px; }
        #row1 { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); grid-auto-rows: 280px; }
        #row2 { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); grid-auto-rows: 220px; }

        .card { width: 100%; height: 100%; border-radius: 16px; position: relative; cursor: grab; overflow: hidden; background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: flex-end; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); background-color: #1a1a24; }
        .card:active { cursor: grabbing; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; z-index: 10; }
        .rating-vip::before { background: var(--vip); }
        .rating-active::before { background: var(--active); }
        .rating-new::before { background: var(--new); }

        .overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 50%, transparent 100%); z-index: 1; }
        .content { position: relative; z-index: 2; padding: 20px; width: 100%; }

        .flag-icon { display: inline-block; font-size: 1.2rem; vertical-align: middle; margin-left: 5px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }
        .cust-code { font-size: 0.65rem; color: #3b82f6; font-family: monospace; font-weight: 700; display: block; margin-bottom: 2px; }
        h3 { font-size: 1.2rem; font-weight: 800; margin-bottom: 2px; text-shadow: 0 2px 5px rgba(0,0,0,0.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .company { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .stats-grid { display: flex; width: 100%; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 10px; margin-top: auto; }
        .stat-box { text-align: center; }
        .stat-val { font-size: 1.1rem; font-weight: 800; color: #fff; }
        .stat-lbl { font-size: 0.7rem; color: #bbb; text-transform: uppercase; letter-spacing: 1px; }

        /* أزرار الإجراءات */
        .card-actions { position: absolute; top: 15px; right: 15px; z-index: 10; display: flex; gap: 8px; }
        .btn-action { width: 36px; height: 36px; border-radius: 50%; background: rgba(37, 211, 102, 0.9); color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; border: none; }
        .btn-action.edit { background: rgba(59, 130, 246, 0.9); }
        .btn-action:hover { transform: scale(1.1); }
        .btn-action i { width: 18px; height: 18px; }

        #row2 .content { padding: 15px; }
        #row2 .cust-code { font-size: 0.55rem; }
        #row2 h3 { font-size: 0.95rem; }
        #row2 .company { font-size: 0.7rem; margin-bottom: 8px; }
        #row2 .stat-val { font-size: 0.85rem; }
        #row2 .stat-lbl { font-size: 0.55rem; }
        #row2 .card-actions { top: 10px; right: 10px; gap: 5px; }
        #row2 .btn-action { width: 28px; height: 28px; }
        #row2 .btn-action i { width: 14px; height: 14px; }

        .sortable-ghost { opacity: 0.3; border: 2px dashed #3b82f6; background: rgba(59, 130, 246, 0.1); }
        .hidden { display: none !important; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 10000; opacity: 0; visibility: hidden; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: #1a1a24; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 30px; width: 90%; max-width: 650px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 5px; }
        .form-control { width: 100%; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; font-family: inherit; outline: none; }
        .form-control:focus { border-color: #3b82f6; }
        .btn-submit { width: 100%; background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .img-preview-box { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; display: none; margin-top: 10px; border: 1px solid #333; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Customers Directory</h1>
        <button class="btn-add" onclick="openModal()"><i data-lucide="plus"></i> Add Customer</button>
    </div>

    <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" onclick="filterCards('all', this)">All</button>
        <button class="filter-btn" onclick="filterCards('PS', this)">🇵🇸 Palestine</button>
        <button class="filter-btn" onclick="filterCards('JO', this)">🇯🇴 Jordan</button>
        <button class="filter-btn" onclick="filterCards('US', this)">🇺🇸 USA</button>
        <button class="filter-btn" onclick="filterCards('CN', this)">🇨🇳 China</button>
    </div>

    <div class="cards-row" id="row1"></div>
    <div class="cards-row" id="row2"></div>

    <div class="modal-overlay" id="customerModal">
        <div class="modal-box">
            <h2 id="modalTitle" style="margin-bottom:20px;">Add New Customer</h2>
            <form id="customerForm" onsubmit="saveCustomer(event)">
                <input type="hidden" id="cId" value="">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                    <div class="form-group"><label>Name *</label><input type="text" id="cName" class="form-control" required oninput="saveDraft()"></div>
                    <div class="form-group"><label>Company</label><input type="text" id="cCompany" class="form-control" oninput="saveDraft()"></div>
                    <div class="form-group"><label>Country</label><select id="cCountry" class="form-control" onchange="saveDraft()"><option value="PS">Palestine 🇵🇸</option><option value="JO">Jordan 🇯🇴</option><option value="US">USA 🇺🇸</option><option value="CN">China 🇨🇳</option></select></div>
                    <div class="form-group"><label>Phone / WhatsApp</label><input type="text" id="cPhone" class="form-control" oninput="saveDraft()"></div>
                    <div class="form-group"><label>Email</label><input type="email" id="cEmail" class="form-control" oninput="saveDraft()"></div>
                    <div class="form-group"><label>Business Scope</label><select id="cScope" class="form-control" onchange="saveDraft()"></select></div>
                </div>
                <div class="form-group"><label>Address</label><input type="text" id="cAddress" class="form-control" oninput="saveDraft()"></div>
                <div class="form-group"><label>Shipping Address</label><input type="text" id="cShippingAddress" class="form-control" oninput="saveDraft()"></div>
                
                <div class="form-group" style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px;">
                    <label>Profile Image</label>
                    <input type="file" id="cImageUpload" class="form-control" accept="image/*" onchange="uploadImage(event)" style="margin-bottom: 5px;">
                    <input type="text" id="cImageUrl" class="form-control" placeholder="Or paste image URL here..." oninput="saveDraft()">
                    <img id="imagePreview" class="img-preview-box">
                </div>
                
                <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px;">
                    <button type="button" onclick="closeModal()" style="padding:10px 20px; background:transparent; color:white; border:none; cursor:pointer;">Cancel</button>
                    <button type="submit" class="btn-submit" style="width:auto;">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../admin.js"></script>
    <script>
        let allCustomers = [];
        let allCategories = [];
        let editingId = null;
        const flags = { 'PS': '🇵🇸', 'JO': '🇯🇴', 'US': '🇺🇸', 'CN': '🇨🇳', 'AL': '🇦🇱', 'BR': '🇧🇷' };
        const defaultImages = ['https://images.unsplash.com/photo-1560250097-0b93528c311a?q=80&w=600&auto=format&fit=crop', 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=600&auto=format&fit=crop', 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=600&auto=format&fit=crop'];

        async function loadData() {
            const token = localStorage.getItem('ione_admin_token');
            try {
                const catRes = await fetch('/api/categories/list', { headers: { 'Authorization': `Bearer ${token}` } });
                const catData = await catRes.json();
                if (catData.success) { allCategories = catData.categories; populateCategories(); }
            } catch(e) {}
            try {
                const cRes = await fetch('/api/customers/list', { headers: { 'Authorization': `Bearer ${token}` } });
                const cData = await cRes.json();
                if (cData.success) { allCustomers = cData.customers; renderCards(); }
            } catch(e) {}
        }

        function populateCategories() {
            const sel = document.getElementById('cScope');
            sel.innerHTML = '<option value="">Select Scope...</option>' + allCategories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        }

        function renderCards() {
            const row1 = document.getElementById('row1');
            const row2 = document.getElementById('row2');
            row1.innerHTML = ''; row2.innerHTML = '';

            allCustomers.forEach((c, index) => {
                const ratingClass = c.total_purchases > 1000 ? 'rating-vip' : (c.total_purchases > 100 ? 'rating-active' : 'rating-new');
                const bgImage = c.image_url || defaultImages[index % defaultImages.length];
                const flag = flags[c.country] || '🌐';
                const waLink = `https://wa.me/${(c.whatsapp||'').replace(/\D/g,'')}?text=${encodeURIComponent('Hello ' + c.name)}`;

                let html = `
                    <div class="card ${ratingClass}" data-country="${c.country}" data-id="${c.id}" style="background-image: url('${bgImage}');">
                        <div class="overlay"></div>
                        <div class="card-actions">
                            <button class="btn-action" onclick="window.open('${waLink}', '_blank')"><i data-lucide="message-circle"></i></button>
                            <button class="btn-action edit" onclick="editCustomer('${c.id}')"><i data-lucide="edit-2"></i></button>
                        </div>
                        <div class="content">
                            <div class="cust-code">${c.customer_code || ''}</div>
                            <h3>${c.name} <span class="flag-icon">${flag}</span></h3>
                            <div class="company">${c.company || 'No Company'}</div>
                            <div class="stats-grid">
                                <div class="stat-box"><div class="stat-val">${c.orders_count}</div><div class="stat-lbl">Orders</div></div>
                                <div class="stat-box"><div class="stat-val">$${c.total_purchases}</div><div class="stat-lbl">Total</div></div>
                            </div>
                        </div>
                    </div>
                `;
                if (index < 4) { row1.innerHTML += html; } else { row2.innerHTML += html; }
            });
            lucide.createIcons();
            initSortable();
        }

        function initSortable() {
            const options = { group: 'shared', animation: 250, ghostClass: 'sortable-ghost' };
            new Sortable(document.getElementById('row1'), options);
            new Sortable(document.getElementById('row2'), options);
        }

        function filterCards(countryCode, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.card').forEach(card => {
                if (countryCode === 'all' || card.dataset.country === countryCode) card.classList.remove('hidden');
                else card.classList.add('hidden');
            });
        }

        function openModal() { 
            document.getElementById('modalTitle').innerText = 'Add New Customer';
            editingId = null;
            document.getElementById('customerForm').reset();
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('customerModal').classList.add('active'); 
            loadDraft();
        }
        function closeModal() { document.getElementById('customerModal').classList.remove('active'); }

        function editCustomer(id) {
            const c = allCustomers.find(x => x.id === id);
            if (!c) return;
            editingId = id;
            document.getElementById('modalTitle').innerText = 'Edit Customer';
            document.getElementById('cId').value = c.id;
            document.getElementById('cName').value = c.name || '';
            document.getElementById('cCompany').value = c.company || '';
            document.getElementById('cCountry').value = c.country || 'US';
            document.getElementById('cPhone').value = c.whatsapp || '';
            document.getElementById('cEmail').value = c.email || '';
            document.getElementById('cScope').value = c.business_scope || '';
            document.getElementById('cAddress').value = c.address || '';
            document.getElementById('cShippingAddress').value = c.shipping_address || '';
            document.getElementById('cImageUrl').value = c.image_url || '';
            
            if (c.image_url) {
                const preview = document.getElementById('imagePreview');
                preview.style.display = 'block';
                preview.src = c.image_url;
            }
            document.getElementById('customerModal').classList.add('active');
        }

        async function uploadImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const preview = document.getElementById('imagePreview');
            preview.style.display = 'block';
            preview.src = URL.createObjectURL(file);
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', 'ione_unsigned');
            try {
                const res = await fetch(`https://api.cloudinary.com/v1_1/xhfnelrf/image/upload`, { method: 'POST', body: formData });
                const data = await res.json();
                document.getElementById('cImageUrl').value = data.secure_url;
                saveDraft();
            } catch(e) { showToast('Failed to upload image', 'error'); }
        }

        function saveDraft() {
            if (editingId) return; 
            const draft = {
                name: document.getElementById('cName').value, company: document.getElementById('cCompany').value,
                country: document.getElementById('cCountry').value, phone: document.getElementById('cPhone').value,
                email: document.getElementById('cEmail').value, scope: document.getElementById('cScope').value,
                address: document.getElementById('cAddress').value, shipping: document.getElementById('cShippingAddress').value,
                imageUrl: document.getElementById('cImageUrl').value
            };
            localStorage.setItem('customer_draft', JSON.stringify(draft));
        }

        function loadDraft() {
            if (editingId) return;
            const saved = localStorage.getItem('customer_draft');
            if (saved) {
                const draft = JSON.parse(saved);
                document.getElementById('cName').value = draft.name || '';
                document.getElementById('cCompany').value = draft.company || '';
                document.getElementById('cCountry').value = draft.country || 'US';
                document.getElementById('cPhone').value = draft.phone || '';
                document.getElementById('cEmail').value = draft.email || '';
                document.getElementById('cScope').value = draft.scope || '';
                document.getElementById('cAddress').value = draft.address || '';
                document.getElementById('cShippingAddress').value = draft.shipping || '';
                document.getElementById('cImageUrl').value = draft.imageUrl || '';
                if (draft.imageUrl) {
                    const preview = document.getElementById('imagePreview');
                    preview.style.display = 'block';
                    preview.src = draft.imageUrl;
                }
            }
        }

        function clearDraft() {
            localStorage.removeItem('customer_draft');
            document.getElementById('customerForm').reset();
            document.getElementById('imagePreview').style.display = 'none';
        }

        async function saveCustomer(e) {
            e.preventDefault();
            const token = localStorage.getItem('ione_admin_token');
            const payload = {
                id: document.getElementById('cId').value,
                name: document.getElementById('cName').value,
                company: document.getElementById('cCompany').value,
                country: document.getElementById('cCountry').value,
                whatsapp: document.getElementById('cPhone').value,
                email: document.getElementById('cEmail').value,
                business_scope: document.getElementById('cScope').value,
                address: document.getElementById('cAddress').value,
                shipping_address: document.getElementById('cShippingAddress').value,
                image_url: document.getElementById('cImageUrl').value,
            };

            const url = editingId ? '/api/customers/update' : '/api/customers/save';
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success) {
                showToast(editingId ? 'Customer updated successfully' : 'Customer added successfully', 'success');
                clearDraft();
                closeModal();
                loadData();
            } else { showToast(data.error, 'error'); }
        }

        window.onload = () => { lucide.createIcons(); loadData(); };
    </script>
</body>
</html>
