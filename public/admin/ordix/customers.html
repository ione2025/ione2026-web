<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IONECENTER - Customers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="../admin.css">
    <style>
        :root {
            --bg-dark: #050508;
            --text: #ffffff;
            --text-muted: #a1a1aa;
            
            --vip: #10b981;      
            --active: #f59e0b;   
            --new: #ef4444;      
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 1.8rem; font-weight: 800; }
        .btn-add { background: #3b82f6; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 700; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-add:hover { background: #2563eb; transform: translateY(-2px); }

        /* Filter Bar */
        .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text); padding: 8px 16px; border-radius: 20px; cursor: pointer;
            font-family: inherit; font-size: 0.9rem; font-weight: 600; transition: 0.2s;
        }
        .filter-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .filter-btn.active { background: #3b82f6; border-color: #3b82f6; color: white; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }

        /* Grid Layout */
        .cards-row { display: grid; gap: 20px; min-height: 100px; margin-bottom: 30px; }
        #row1 { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); grid-auto-rows: 280px; }
        #row2 { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); grid-auto-rows: 220px; }

        /* Card Styling */
        .card {
            width: 100%; height: 100%; border-radius: 16px; position: relative;
            cursor: grab; overflow: hidden; background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: flex-end;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            background-color: #1a1a24;
        }
        .card:active { cursor: grabbing; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 15px 40px rgba(0,0,0,0.6); }

        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; z-index: 10; }
        .rating-vip::before { background: var(--vip); }
        .rating-active::before { background: var(--active); }
        .rating-new::before { background: var(--new); }

        .overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 50%, transparent 100%); z-index: 1; }
        .content { position: relative; z-index: 2; padding: 20px; width: 100%; }

        .flag-icon { display: inline-block; font-size: 1.2rem; vertical-align: middle; margin-left: 5px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }

        h3 { font-size: 1.2rem; font-weight: 800; margin-bottom: 2px; text-shadow: 0 2px 5px rgba(0,0,0,0.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .company { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        
        .stats-grid { display: flex; width: 100%; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 10px; margin-top: auto; }
        .stat-box { text-align: center; }
        .stat-val { font-size: 1.1rem; font-weight: 800; color: #fff; }
        .stat-lbl { font-size: 0.7rem; color: #bbb; text-transform: uppercase; letter-spacing: 1px; }

        .btn-wa { position: absolute; top: 15px; right: 15px; z-index: 10; width: 36px; height: 36px; border-radius: 50%; background: rgba(37, 211, 102, 0.9); color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .btn-wa:hover { transform: scale(1.1); background: #25D366; }

        #row2 .content { padding: 15px; }
        #row2 h3 { font-size: 0.95rem; }
        #row2 .company { font-size: 0.7rem; margin-bottom: 8px; }
        #row2 .stat-val { font-size: 0.85rem; }
        #row2 .stat-lbl { font-size: 0.55rem; }
        #row2 .btn-wa { width: 28px; height: 28px; top: 10px; right: 10px; }

        .sortable-ghost { opacity: 0.3; border: 2px dashed #3b82f6; background: rgba(59, 130, 246, 0.1); }
        .hidden { display: none !important; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 10000; opacity: 0; visibility: hidden; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: #1a1a24; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 30px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 5px; }
        .form-control { width: 100%; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; font-family: inherit; }
        .btn-submit { width: 100%; background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Customers Directory</h1>
        <button class="btn-add" onclick="openModal()"><i data-lucide="plus"></i> Add Customer</button>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" onclick="filterCards('all', this)">All</button>
        <button class="filter-btn" onclick="filterCards('PS', this)">🇵🇸 Palestine</button>
        <button class="filter-btn" onclick="filterCards('JO', this)">🇯🇴 Jordan</button>
        <button class="filter-btn" onclick="filterCards('US', this)">🇺🇸 USA</button>
        <button class="filter-btn" onclick="filterCards('CN', this)">🇨🇳 China</button>
    </div>

    <!-- Rows -->
    <div class="cards-row" id="row1"></div>
    <div class="cards-row" id="row2"></div>

    <!-- Modal Add Customer -->
    <div class="modal-overlay" id="customerModal">
        <div class="modal-box">
            <h2 style="margin-bottom:20px;">Add New Customer</h2>
            <form onsubmit="saveCustomer(event)">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                    <div class="form-group"><label>Name *</label><input type="text" id="cName" class="form-control" required></div>
                    <div class="form-group"><label>Company</label><input type="text" id="cCompany" class="form-control"></div>
                    <div class="form-group"><label>Country</label>
                        <select id="cCountry" class="form-control">
                            <option value="PS">Palestine 🇵🇸</option>
                            <option value="JO">Jordan 🇯🇴</option>
                            <option value="US">USA 🇺🇸</option>
                            <option value="CN">China 🇨🇳</option>
                            <option value="AL">Albania 🇦🇱</option>
                            <option value="BR">Brazil 🇧🇷</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Phone / WhatsApp</label><input type="text" id="cPhone" class="form-control"></div>
                    <div class="form-group"><label>Email</label><input type="email" id="cEmail" class="form-control"></div>
                    <div class="form-group"><label>Business Scope</label><input type="text" id="cScope" class="form-control"></div>
                </div>
                <div class="form-group"><label>Address</label><input type="text" id="cAddress" class="form-control"></div>
                <div class="form-group"><label>Image URL (Optional)</label><input type="text" id="cImage" class="form-control" placeholder="https://..."></div>
                
                <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px;">
                    <button type="button" onclick="closeModal()" style="padding:10px 20px; background:transparent; color:white; border:none; cursor:pointer;">Cancel</button>
                    <button type="submit" class="btn-submit" style="width:auto;">Save Customer</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../admin.js"></script>
    <script>
        let allCustomers = [];
        const flags = { 'PS': '🇵🇸', 'JO': '🇯🇴', 'US': '🇺🇸', 'CN': '🇨🇳', 'AL': '🇦🇱', 'BR': '🇧🇷' };
        const defaultImages = [
            'https://images.unsplash.com/photo-1560250097-0b93528c311a?q=80&w=600&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=600&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=600&auto=format&fit=crop'
        ];

        async function loadCustomers() {
            const token = localStorage.getItem('ione_admin_token');
            const res = await fetch('/api/customers/list', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            if (data.success) {
                allCustomers = data.customers;
                renderCards();
            }
        }

        function renderCards() {
            const row1 = document.getElementById('row1');
            const row2 = document.getElementById('row2');
            row1.innerHTML = ''; row2.innerHTML = '';

            // للعرض فقط: نضع أول 4 كروت في الصف الأول والباقي في الثاني
            allCustomers.forEach((c, index) => {
                const ratingClass = c.total_purchases > 1000 ? 'rating-vip' : (c.total_purchases > 100 ? 'rating-active' : 'rating-new');
                const bgImage = c.image_url || defaultImages[index % defaultImages.length];
                const flag = flags[c.country] || '🌐';

                let html = `
                    <div class="card ${ratingClass}" data-country="${c.country}" data-id="${c.id}" style="background-image: url('${bgImage}');">
                        <div class="overlay"></div>
                        <div class="btn-wa"><i data-lucide="message-circle"></i></div>
                        <div class="content">
                            <h3>${c.name} <span class="flag-icon">${flag}</span></h3>
                            <div class="company">${c.company || 'No Company'}</div>
                            <div class="stats-grid">
                                <div class="stat-box"><div class="stat-val">${c.orders_count}</div><div class="stat-lbl">Orders</div></div>
                                <div class="stat-box"><div class="stat-val">$${c.total_purchases}</div><div class="stat-lbl">Total</div></div>
                            </div>
                        </div>
                    </div>
                `;

                if (index < 4) { row1.innerHTML += html; }
                else { row2.innerHTML += html; }
            });

            lucide.createIcons();
            initSortable();
        }

        function initSortable() {
            const options = { group: 'shared', animation: 250, ghostClass: 'sortable-ghost' };
            new Sortable(document.getElementById('row1'), options);
            new Sortable(document.getElementById('row2'), options);
        }

        function filterCards(countryCode, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.card').forEach(card => {
                if (countryCode === 'all' || card.dataset.country === countryCode) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        function openModal() { document.getElementById('customerModal').classList.add('active'); }
        function closeModal() { document.getElementById('customerModal').classList.remove('active'); }

        async function saveCustomer(e) {
            e.preventDefault();
            const token = localStorage.getItem('ione_admin_token');
            const payload = {
                name: document.getElementById('cName').value,
                company: document.getElementById('cCompany').value,
                country: document.getElementById('cCountry').value,
                whatsapp: document.getElementById('cPhone').value,
                email: document.getElementById('cEmail').value,
                business_scope: document.getElementById('cScope').value,
                address: document.getElementById('cAddress').value,
                image_url: document.getElementById('cImage').value,
                type: 'offline'
            };

            const res = await fetch('/api/customers/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success) {
                showToast('Customer added successfully', 'success');
                closeModal();
                loadCustomers();
            } else {
                showToast(data.error, 'error');
            }
        }

        window.onload = () => { lucide.createIcons(); loadCustomers(); };
    </script>
</body>
</html>
