<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><title>IONECENTER — الإعدادات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../admin.css"><link rel="stylesheet" href="../_assets/dashboard.css">
    <style>
        .settings-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 30px; max-width: 700px; margin: 0 auto; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--text-secondary); }
        .form-control { width: 100%; padding: 12px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-family: inherit; }
        .btn-save { background: #34C759; color: white; border: none; padding: 14px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; }
    </style>
</head>
<body class="dashboard-page">
    <div class="top-bar">
        <div class="top-bar-logo"><a href="../dashboard.html"><img src="../../assets/logo.png" style="height:40px;"></a></div>
        <div class="top-bar-user"><a href="../dashboard.html" class="logout-btn" style="text-decoration:none;">رجوع</a></div>
    </div>
    <div class="dashboard-container">
        <h1 class="page-title" style="text-align:center; margin-bottom:30px;">⚙️ إعدادات الشركة</h1>
        
        <div class="settings-box">
            <form id="settingsForm" onsubmit="saveSettings(event)">
                <div class="form-group">
                    <label>اسم الشركة (الأساسي)</label>
                    <input type="text" id="company_name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>اسم الشركة (الفرعي)</label>
                    <input type="text" id="company_name_2" class="form-control">
                </div>
                <div class="form-group">
                    <label>العنوان</label>
                    <input type="text" id="address" class="form-control">
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email" class="form-control">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="text" id="phone" class="form-control">
                </div>
                <div class="form-group">
                    <label>معلومات إضافية</label>
                    <textarea id="info" class="form-control" rows="3"></textarea>
                </div>
                <button type="submit" class="btn-save">حفظ الإعدادات</button>
            </form>
        </div>
    </div>
    <script src="../admin.js"></script>
    <script>
        async function loadSettings() {
            const token = localStorage.getItem('ione_admin_token');
            const res = await fetch('/api/settings/get', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            if (data.success) {
                const s = data.settings;
                document.getElementById('company_name').value = s.company_name || '';
                document.getElementById('company_name_2').value = s.company_name_2 || '';
                document.getElementById('address').value = s.address || '';
                document.getElementById('email').value = s.email || '';
                document.getElementById('phone').value = s.phone || '';
                document.getElementById('info').value = s.info || '';
            }
        }

        async function saveSettings(e) {
            e.preventDefault();
            const token = localStorage.getItem('ione_admin_token');
            const payload = {
                company_name: document.getElementById('company_name').value,
                company_name_2: document.getElementById('company_name_2').value,
                address: document.getElementById('address').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                info: document.getElementById('info').value
            };
            const res = await fetch('/api/settings/save', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success) { showToast('تم حفظ الإعدادات بنجاح', 'success'); }
            else { showToast(data.error, 'error'); }
        }

        window.onload = () => { lucide.createIcons(); loadSettings(); };
    </script>
</body>
</html>
