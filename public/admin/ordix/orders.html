<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>IONECENTER — قائمة الطلبات</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" type="image/png" href="../../assets/logo.png">
    <link rel="stylesheet" href="../admin.css">
    <link rel="stylesheet" href="../_assets/dashboard.css">
    <style>
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-chip { padding: 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); text-align: center; cursor: pointer; transition: 0.2s; }
        .stat-chip:hover { transform: translateY(-2px); }
        .stat-chip.active { border-color: var(--ione-red); box-shadow: 0 0 0 2px rgba(227,30,36,0.2); }
        .stat-chip .num { font-size: 1.6rem; font-weight: 800; margin-bottom: 4px; }
        .stat-chip .lbl { font-size: 0.75rem; color: var(--text-secondary); font-weight: 600; }
        
        .orders-toolbar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 250px; position: relative; }
        .search-box input { width: 100%; padding: 12px 16px 12px 44px; background: var(--bg-card); border: 1.5px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary); font-family: inherit; font-size: 0.95rem; outline: none; }
        .search-box svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--text-secondary); }
        .filter-select { padding: 12px 16px; background: var(--bg-card); border: 1.5px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary); font-family: inherit; font-size: 0.95rem; cursor: pointer; }
        
        .orders-table-wrap { background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border); overflow: hidden; }
        .orders-table { width: 100%; border-collapse: collapse; }
        .orders-table th { background: var(--bg-secondary); padding: 14px 16px; text-align: right; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
        .orders-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); color: var(--text-primary); font-size: 0.9rem; }
        .orders-table tr:last-child td { border-bottom: none; }
        .orders-table tr:hover { background: var(--bg-card-hover); }
        
        .orders-table tr.row-yellow { border-right: 4px solid #FF9F0A; }
        .orders-table tr.row-red { border-right: 4px solid #FF3B30; }
        .orders-table tr.row-green { border-right: 4px solid #34C759; }
        
        .seq-num { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: var(--bg-secondary); color: var(--text-secondary); font-weight: 700; font-size: 0.75rem; }
        .order-code { font-family: 'Courier New', monospace; font-weight: 700; color: var(--ione-red); font-size: 0.85rem; direction: ltr; text-align: right; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; white-space: nowrap; }
        .status-new { background: rgba(255,159,10,0.15); color: #FF9F0A; }
        .status-pending { background: rgba(255,159,10,0.15); color: #FF9F0A; }
        .status-progress { background: rgba(0,113,227,0.15); color: #0071e3; }
        .status-done { background: rgba(52,199,89,0.15); color: #34C759; }
        .status-cancelled { background: rgba(255,59,48,0.15); color: #FF3B30; }
        
        .actions-cell { display: flex; gap: 6px; flex-wrap: nowrap; }
        .action-icon { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: 0.2s; }
        .action-icon svg { width: 14px; height: 14px; }
        .action-icon:hover { transform: scale(1.1); }
        .action-icon.view:hover { background: #0071e3; color: white; }
        .action-icon.pay { background: rgba(52,199,89,0.15); color: #34C759; border-color: #34C759; }
        .action-icon.pay:hover { background: #34C759; color: white; }
        .action-icon.whatsapp:hover { background: #25D366; color: white; }
        .action-icon.delete:hover { background: #FF3B30; color: white; }
        
        .empty-state { text-align: center; padding: 80px 24px; color: var(--text-secondary); }
        .empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.4; }
        .loading-state { text-align: center; padding: 60px 24px; color: var(--text-secondary); }
        .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--ione-red); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="dashboard-page">
    
    <div class="top-bar">
        <div class="top-bar-logo">
            <a href="../dashboard.html" style="text-decoration: none;"><img src="../../assets/logo.png" alt="IONE CENTER"></a>
        </div>
        <div class="top-bar-user">
            <a href="new-order.html" class="logout-btn" style="text-decoration: none;"><i data-lucide="plus"></i><span>طلب جديد</span></a>
            <a href="../dashboard.html" class="logout-btn" style="text-decoration: none;"><i data-lucide="arrow-right"></i><span>رجوع</span></a>
        </div>
    </div>

    <div class="dashboard-container">
        <div class="page-header">
            <div>
                <h1 class="page-title">📋 قائمة الطلبات</h1>
                <p class="page-subtitle">جميع طلبات العملاء</p>
            </div>
            <button class="action-icon view" onclick="loadOrders()" style="width: 42px; height: 42px;"><i data-lucide="refresh-cw"></i></button>
        </div>

        <div class="stats-row" id="statsRow"></div>

        <div class="orders-toolbar">
            <div class="search-box">
                <i data-lucide="search"></i>
                <input type="text" id="searchInput" placeholder="ابحث برقم الطلب / اسم العميل / الجوال...">
            </div>
            <select class="filter-select" id="statusFilter">
                <option value="all">كل الحالات</option>
                <option value="new">جديد</option>
                <option value="pending">بانتظار العروض</option>
                <option value="progress">قيد التنفيذ</option>
                <option value="done">مكتمل</option>
                <option value="cancelled">ملغي</option>
            </select>
        </div>

        <div id="ordersContainer">
            <div class="loading-state"><div class="spinner"></div><p>جاري تحميل الطلبات...</p></div>
        </div>
    </div>

    <script src="../admin.js"></script>
    <script>
        let allOrders = [];
        let filteredOrders = [];
        let currentFilter = 'all';

        async function loadOrders() {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = `<div class="loading-state"><div class="spinner"></div><p>جاري تحميل الطلبات...</p></div>`;
            try {
                const token = localStorage.getItem('ione_admin_token');
                const res = await fetch('/api/orders/list', { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.status === 401) { window.location.href = '../login.html'; return; }
                const data = await res.json();
                if (data.success) {
                    allOrders = data.orders || [];
                    filteredOrders = [...allOrders];
                    renderStats(data.stats || {});
                    renderOrders();
                }
            } catch(e) { console.error(e); }
        }

        function renderStats(stats) {
            const row = document.getElementById('statsRow');
            const cfg = [ { key: 'total', label: 'الكل' }, { key: 'new', label: 'جديد' }, { key: 'pending', label: 'بانتظار' }, { key: 'progress', label: 'قيد التنفيذ' }, { key: 'done', label: 'مكتمل' }, { key: 'cancelled', label: 'ملغي' } ];
            row.innerHTML = cfg.map(s => `<div class="stat-chip ${currentFilter===s.key?'active':''}" onclick="filterByStat('${s.key}')"><div class="num" style="color:${s.key==='cancelled'?'#FF3B30':s.key==='done'?'#34C759':'#FF9F0A'}">${stats[s.key]||0}</div><div class="lbl">${s.label}</div></div>`).join('');
        }

        function filterByStat(key) {
            currentFilter = key;
            document.getElementById('statusFilter').value = key === 'total' ? 'all' : key;
            applyFilters();
            document.querySelectorAll('.stat-chip').forEach(c => c.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            if (filteredOrders.length === 0) { container.innerHTML = `<div class="empty-state"><i data-lucide="inbox"></i><h3>لا توجد طلبات</h3></div>`; lucide.createIcons(); return; }
            const labels = { 'new': 'جديد', 'pending': 'بانتظار', 'progress': 'قيد التنفيذ', 'done': 'مكتمل', 'cancelled': 'ملغي' };
            container.innerHTML = `<div class="orders-table-wrap"><table class="orders-table"><thead><tr><th>#</th><th>رقم الطلب</th><th>العميل</th><th>المنتج</th><th>الحالة</th><th>التاريخ</th><th>إجراء</th></tr></thead><tbody>
                ${filteredOrders.map(o => `<tr class="row-${o.color || 'yellow'}">
                    <td><span class="seq-num">${o.seq}</span></td>
                    <td><span class="order-code">${o.order_code}</span></td>
                    <td>${o.customer_name}</td>
                    <td>${(o.product_description||'').substring(0,30)}...</td>
                    <td><span class="status-badge status-${o.status}">${labels[o.status]}</span></td>
                    <td>${new Date(o.created_at).toLocaleDateString('ar-EG')}</td>
                    <td><div class="actions-cell">
                        <button class="action-icon view" onclick="viewOrder('${o.order_code}')"><i data-lucide="eye"></i></button>
                        ${o.status==='new'?`<button class="action-icon pay" onclick="confirmPayment('${o.order_code}')"><i data-lucide="dollar-sign"></i></button>`:''}
                        <button class="action-icon delete" onclick="deleteOrder('${o.order_code}')"><i data-lucide="trash-2"></i></button>
                    </div></td>
                </tr>`).join('')}
            </tbody></table></div>`;
            lucide.createIcons();
        }

        function applyFilters() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const s = document.getElementById('statusFilter').value;
            currentFilter = s;
            filteredOrders = allOrders.filter(o => (s==='all'||o.status===s) && (!q || (o.order_code||'').toLowerCase().includes(q) || (o.customer_name||'').toLowerCase().includes(q)));
            renderOrders();
        }

        function viewOrder(code) { window.location.href = `order-details.html?code=${code}`; }
        
        async function deleteOrder(code) {
            if (!confirm('حذف الطلب؟')) return;
            const token = localStorage.getItem('ione_admin_token');
            await fetch('/api/orders/delete', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ order_code: code }) });
            loadOrders();
        }

        async function confirmPayment(code) {
            // 1. جلب بيانات الطلب
            const token = localStorage.getItem('ione_admin_token');
            const res = await fetch(`/api/orders/get?code=${code}`, { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            if (!data.success) { showToast('فشل جلب الطلب', 'error'); return; }
            const order = data.order;

            // 2. إدخال البيانات (للتجربة)
            const supplier = prompt('اسم المورد:', 'مورد افتراضي');
            if (supplier === null) return;
            const purchase = prompt('سعر الشراء (CNY):', '0');
            if (purchase === null) return;
            const sale = prompt('سعر البيع (USD):', '0');
            if (sale === null) return;

            // 3. جلب أول صندوق (افتراضي)
            const banksRes = await fetch('/api/banks/list', { headers: { 'Authorization': `Bearer ${token}` } });
            const banksData = await banksRes.json();
            const bankId = banksData.banks[0].box_id;

            // 4. تنفيذ التأكيد
            const confirmRes = await fetch('/api/orders/confirm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({
                    order_code: code,
                    supplier_name: supplier,
                    purchase_price: parseFloat(purchase),
                    purchase_currency: 'CNY',
                    sale_price: parseFloat(sale),
                    sale_currency: 'USD',
                    bank_id: bankId
                })
            });
            const confirmData = await confirmRes.json();
            if (confirmData.success) {
                showToast('تم إنشاء الفواتير بنجاح ✅', 'success');
                loadOrders();
            } else {
                showToast('فشل: ' + confirmData.error, 'error');
            }
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('statusFilter').addEventListener('change', applyFilters);
        window.onload = () => { lucide.createIcons(); loadOrders(); };
    </script>
</body>
</html>
