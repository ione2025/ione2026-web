<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>IONECENTER — قائمة الطلبات</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" type="image/png" href="../../assets/logo.png">
    <link rel="stylesheet" href="../admin.css">
    <link rel="stylesheet" href="../_assets/dashboard.css">
    <style>
        .orders-toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            background: var(--bg-card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-ar);
            font-size: 0.95rem;
            outline: none;
            transition: all var(--transition);
        }
        .search-box input:focus {
            border-color: var(--ione-red);
        }
        .search-box svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--text-secondary);
        }
        .filter-select {
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-ar);
            font-size: 0.95rem;
            cursor: pointer;
            outline: none;
        }
        .orders-table {
            width: 100%;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .orders-table table {
            width: 100%;
            border-collapse: collapse;
        }
        .orders-table th {
            background: var(--bg-secondary);
            padding: 16px;
            text-align: right;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }
        .orders-table td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 0.9rem;
        }
        .orders-table tr:last-child td {
            border-bottom: none;
        }
        .orders-table tr:hover {
            background: var(--bg-card-hover);
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .status-new { background: rgba(52,199,89,0.15); color: #34C759; }
        .status-pending { background: rgba(255,159,10,0.15); color: #FF9F0A; }
        .status-progress { background: rgba(0,113,227,0.15); color: #0071e3; }
        .status-done { background: rgba(139,92,246,0.15); color: #8B5CF6; }
        .status-cancelled { background: rgba(255,59,48,0.15); color: #FF3B30; }
        .empty-state {
            text-align: center;
            padding: 80px 24px;
            color: var(--text-secondary);
        }
        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.4;
        }
        .empty-state h3 {
            font-size: 1.25rem;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        .btn-small {
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            cursor: pointer;
            font-family: var(--font-ar);
            transition: all var(--transition);
        }
        .btn-small:hover {
            background: var(--ione-red);
            border-color: var(--ione-red);
            color: white;
        }
        .loading-state {
            text-align: center;
            padding: 60px 24px;
            color: var(--text-secondary);
        }
        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--ione-red);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .stat-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat-chip {
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .stat-chip strong {
            color: var(--text-primary);
            font-size: 1rem;
            margin-left: 6px;
        }
    </style>
</head>
<body class="dashboard-page">
    
    <div class="top-bar">
        <div class="top-bar-logo">
            <a href="../dashboard.html" style="text-decoration: none;">
                <img src="../../assets/logo.png" alt="IONE CENTER">
            </a>
        </div>
        <div class="top-bar-user">
            <a href="new-order.html" class="logout-btn" style="text-decoration: none;">
                <i data-lucide="plus"></i>
                <span>طلب جديد</span>
            </a>
            <a href="../dashboard.html" class="logout-btn" style="text-decoration: none;">
                <i data-lucide="arrow-right"></i>
                <span>رجوع</span>
            </a>
        </div>
    </div>

    <div class="dashboard-container">
        
        <div class="page-header">
            <div>
                <h1 class="page-title">📋 قائمة الطلبات</h1>
                <p class="page-subtitle">جميع طلبات العملاء</p>
            </div>
            <button class="btn-small" id="refreshBtn" style="padding: 10px 16px;">
                <i data-lucide="refresh-cw" style="width: 16px; height: 16px;"></i>
                تحديث
            </button>
        </div>

        <!-- Stats -->
        <div class="stat-bar" id="statBar" style="display: none;">
            <div class="stat-chip">الكل <strong id="statTotal">0</strong></div>
            <div class="stat-chip">جديد <strong id="statNew">0</strong></div>
            <div class="stat-chip">قيد التنفيذ <strong id="statProgress">0</strong></div>
            <div class="stat-chip">مكتمل <strong id="statDone">0</strong></div>
        </div>

        <!-- Toolbar -->
        <div class="orders-toolbar">
            <div class="search-box">
                <i data-lucide="search"></i>
                <input type="text" id="searchInput" placeholder="ابحث برقم الطلب أو اسم العميل...">
            </div>
            <select class="filter-select" id="statusFilter">
                <option value="all">كل الحالات</option>
                <option value="new">جديد</option>
                <option value="pending">بانتظار العروض</option>
                <option value="progress">قيد التنفيذ</option>
                <option value="done">مكتمل</option>
                <option value="cancelled">ملغي</option>
            </select>
        </div>

        <!-- Orders Container -->
        <div id="ordersContainer">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>جاري تحميل الطلبات...</p>
            </div>
        </div>

    </div>

    <script src="../admin.js"></script>
    <script>
        // ─────────────────────────────────────────────
        // 📦 State
        // ─────────────────────────────────────────────
        let allOrders = [];
        let filteredOrders = [];
        
        // ─────────────────────────────────────────────
        // 🌐 Load Orders from API
        // ─────────────────────────────────────────────
        async function loadOrders() {
            const container = document.getElementById('ordersContainer');
            
            container.innerHTML = `
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>جاري تحميل الطلبات...</p>
                </div>
            `;
            
            try {
                const token = localStorage.getItem('ione_admin_token');
                
                if (!token) {
                    throw new Error('لم يتم العثور على رمز الدخول');
                }
                
                const response = await fetch('/api/orders/list', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.status === 401 || response.status === 403) {
                    localStorage.removeItem('ione_admin_token');
                    localStorage.removeItem('ione_admin_user');
                    window.location.href = '../login.html';
                    return;
                }
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.error || 'فشل تحميل الطلبات');
                }
                
                allOrders = result.orders || [];
                filteredOrders = [...allOrders];
                
                updateStats();
                renderOrders();
                
            } catch (error) {
                console.error('Load error:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <i data-lucide="alert-circle"></i>
                        <h3>فشل تحميل الطلبات</h3>
                        <p>${error.message}</p>
                        <button class="btn-small" onclick="loadOrders()" style="margin-top: 16px; padding: 10px 20px;">
                            حاول مرة أخرى
                        </button>
                    </div>
                `;
                lucide.createIcons();
            }
        }
        
        // ─────────────────────────────────────────────
        // 📊 Update Stats
        // ─────────────────────────────────────────────
        function updateStats() {
            const statBar = document.getElementById('statBar');
            statBar.style.display = 'flex';
            
            document.getElementById('statTotal').textContent = allOrders.length;
            document.getElementById('statNew').textContent = 
                allOrders.filter(o => o.status === 'new').length;
            document.getElementById('statProgress').textContent = 
                allOrders.filter(o => o.status === 'progress').length;
            document.getElementById('statDone').textContent = 
                allOrders.filter(o => o.status === 'done').length;
        }
        
        // ─────────────────────────────────────────────
        // 🎨 Render Orders Table
        // ─────────────────────────────────────────────
        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            
            if (filteredOrders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i data-lucide="inbox"></i>
                        <h3>${allOrders.length === 0 ? 'لا توجد طلبات بعد' : 'لا توجد نتائج مطابقة'}</h3>
                        <p>${allOrders.length === 0 ? 'ستظهر الطلبات هنا عند وصولها من الزبائن' : 'جرّب تغيير كلمة البحث أو الفلتر'}</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }
            
            const statusLabels = {
                'new': 'جديد',
                'pending': 'بانتظار العروض',
                'progress': 'قيد التنفيذ',
                'done': 'مكتمل',
                'cancelled': 'ملغي'
            };
            
            container.innerHTML = `
                <div class="orders-table">
                    <table>
                        <thead>
                            <tr>
                                <th>رقم الطلب</th>
                                <th>العميل</th>
                                <th>المنتج</th>
                                <th>الوجهة</th>
                                <th>الحالة</th>
                                <th>التاريخ</th>
                                <th>إجراء</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filteredOrders.map((order, i) => `
                                <tr>
                                    <td><strong style="color: var(--ione-red); font-family: monospace;">${order.order_code || 'N/A'}</strong></td>
                                    <td>${order.customer_name || 'N/A'}</td>
                                    <td>${(order.product_description || '').substring(0, 40)}${order.product_description && order.product_description.length > 40 ? '...' : ''}</td>
                                    <td>${order.target_country || '—'}</td>
                                    <td><span class="status-badge status-${order.status || 'new'}">${statusLabels[order.status] || 'جديد'}</span></td>
                                    <td>${formatDate(order.created_at)}</td>
                                    <td>
                                        <button class="btn-small" onclick="viewOrder('${order.order_code}')">
                                            <i data-lucide="eye" style="width: 14px; height: 14px; display: inline-block; vertical-align: middle;"></i>
                                            عرض
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            
            lucide.createIcons();
        }
        
        // ─────────────────────────────────────────────
        // 🔍 Search + Filter
        // ─────────────────────────────────────────────
        function applyFilters() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const status = document.getElementById('statusFilter').value;
            
            filteredOrders = allOrders.filter(order => {
                const matchStatus = status === 'all' || order.status === status;
                const matchQuery = !query || 
                    (order.order_code || '').toLowerCase().includes(query) ||
                    (order.customer_name || '').toLowerCase().includes(query) ||
                    (order.product_description || '').toLowerCase().includes(query);
                return matchStatus && matchQuery;
            });
            
            renderOrders();
        }
        
        // ─────────────────────────────────────────────
        // 👁️ View Order
        // ─────────────────────────────────────────────
        function viewOrder(orderCode) {
            window.location.href = `order-details.html?code=${encodeURIComponent(orderCode)}`;
        }
        
        // ─────────────────────────────────────────────
        // 🔧 Helpers
        // ─────────────────────────────────────────────
        function formatDate(iso) {
            if (!iso) return '—';
            try {
                const d = new Date(iso);
                return d.toLocaleDateString('ar-EG', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
            } catch { return '—'; }
        }
        
        // ─────────────────────────────────────────────
        // 🚀 Init — Run after DOM ready
        // ─────────────────────────────────────────────
        function init() {
            // Bind events
            const searchInput = document.getElementById('searchInput');
            const statusFilter = document.getElementById('statusFilter');
            const refreshBtn = document.getElementById('refreshBtn');
            
            if (searchInput) searchInput.addEventListener('input', applyFilters);
            if (statusFilter) statusFilter.addEventListener('change', applyFilters);
            if (refreshBtn) {
                refreshBtn.addEventListener('click', () => {
                    searchInput.value = '';
                    statusFilter.value = 'all';
                    loadOrders();
                });
            }
            
            // Initial load
            loadOrders();
            
            console.log(
                '%c 📋 Orders Page v3.0 ',
                'background: #0071e3; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold;'
            );
        }
        
        // Wait for DOM
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
