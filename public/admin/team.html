<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>IONECENTER - Team</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="admin.css">
    <style>
        body { background: #050508; color: white; font-family: 'Inter', sans-serif; padding: 20px; }
        .header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .btn-add { background: #8B5CF6; color: white; padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: #1a1a24; border-radius: 16px; padding: 20px; text-align: center; border: 1px solid #333; cursor: pointer; transition: 0.2s; }
        .card:hover { border-color: #8B5CF6; transform: translateY(-3px); }
        .card img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 2px solid #8B5CF6; }
        .card h3 { margin: 5px 0; font-size: 1.2rem; }
        .card p { color: #aaa; font-size: 0.85rem; margin: 2px 0; }
        .code { background: rgba(139,92,246,0.2); color: #a855f7; padding: 2px 8px; border-radius: 4px; font-family: monospace; font-weight: bold; font-size: 0.8rem; display: inline-block; margin-bottom: 10px; }
        
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: #1a1a24; padding: 30px; border-radius: 16px; width: 400px; border: 1px solid #444; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #aaa; font-size: 0.85rem; }
        .form-control { width: 100%; padding: 10px; background: #000; border: 1px solid #333; border-radius: 8px; color: white; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Team Members</h1>
        <button class="btn-add" onclick="openModal()">+ Add Member</button>
    </div>
    <div class="grid" id="teamGrid"></div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px;" id="modalTitle">Add Team Member</h2>
            <input type="hidden" id="tId">
            <div class="form-group"><label>Name</label><input type="text" id="tName" class="form-control"></div>
            <div class="form-group"><label>Role</label><input type="text" id="tRole" class="form-control" placeholder="Admin, Tester, Developer..."></div>
            <div class="form-group"><label>Email</label><input type="email" id="tEmail" class="form-control"></div>
            <div class="form-group"><label>Phone</label><input type="text" id="tPhone" class="form-control"></div>
            <div class="form-group"><label>Image URL</label><input type="text" id="tImage" class="form-control" placeholder="https://..."></div>
            
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="deleteMember()" id="btnDelete" style="background: #ef4444; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; display: none;">Delete</button>
                <button onclick="saveMember()" style="background: #8B5CF6; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 2;">Save</button>
            </div>
            <button onclick="document.getElementById('editModal').classList.remove('active')" style="width: 100%; background: transparent; color: #aaa; border: none; margin-top: 15px; cursor: pointer;">Cancel</button>
        </div>
    </div>

    <script src="admin.js"></script>
    <script>
        let teamData = [];

        async function loadTeam() {
            const token = localStorage.getItem('ione_admin_token');
            const res = await fetch('/api/team/list', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            if (data.success) {
                teamData = data.team;
                const grid = document.getElementById('teamGrid');
                grid.innerHTML = teamData.length === 0 ? '<p>No team members yet.</p>' : teamData.map(m => `
                    <div class="card" onclick="editMember('${m.id}')">
                        <img src="${m.image_url || 'https://ui-avatars.com/api/?name=' + m.name}" alt="${m.name}">
                        <div class="code">${m.code}</div>
                        <h3>${m.name}</h3>
                        <p>${m.role}</p>
                        <p>${m.email || ''}</p>
                    </div>
                `).join('');
            }
        }

        function openModal() {
            document.getElementById('modalTitle').innerText = 'Add Team Member';
            document.getElementById('tId').value = '';
            document.getElementById('tName').value = '';
            document.getElementById('tRole').value = '';
            document.getElementById('tEmail').value = '';
            document.getElementById('tPhone').value = '';
            document.getElementById('tImage').value = '';
            document.getElementById('btnDelete').style.display = 'none';
            document.getElementById('editModal').classList.add('active');
        }

        function editMember(id) {
            const m = teamData.find(x => x.id === id);
            if(!m) return;
            document.getElementById('modalTitle').innerText = 'Edit Team Member';
            document.getElementById('tId').value = m.id;
            document.getElementById('tName').value = m.name;
            document.getElementById('tRole').value = m.role;
            document.getElementById('tEmail').value = m.email || '';
            document.getElementById('tPhone').value = m.phone || '';
            document.getElementById('tImage').value = m.image_url || '';
            document.getElementById('btnDelete').style.display = 'block';
            document.getElementById('editModal').classList.add('active');
        }

        async function saveMember() {
            const token = localStorage.getItem('ione_admin_token');
            const id = document.getElementById('tId').value;
            const payload = {
                id: id || undefined,
                name: document.getElementById('tName').value,
                role: document.getElementById('tRole').value,
                email: document.getElementById('tEmail').value,
                phone: document.getElementById('tPhone').value,
                image_url: document.getElementById('tImage').value
            };
            const url = id ? '/api/team/update' : '/api/team/save';
            await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify(payload) });
            document.getElementById('editModal').classList.remove('active');
            loadTeam();
        }

        async function deleteMember() {
            if(!confirm('Are you sure?')) return;
            const token = localStorage.getItem('ione_admin_token');
            const id = document.getElementById('tId').value;
            await fetch('/api/team/delete', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ id }) });
            document.getElementById('editModal').classList.remove('active');
            loadTeam();
        }

        window.onload = loadTeam;
    </script>
</body>
</html>
