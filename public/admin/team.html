<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>IONECENTER - Team</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="admin.css">
    <style>
        body { background: #050508; color: white; font-family: 'Inter', sans-serif; padding: 20px; }
        .header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .btn-add { background: #8B5CF6; color: white; padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        /* تصميم البطاقات (Full Cover) */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { position: relative; height: 280px; border-radius: 16px; background-size: cover; background-position: center; overflow: hidden; border: 1px solid #333; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.6); border-color: #8B5CF6; }
        .card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.2) 50%, transparent); z-index: 1; }
        
        .card-content { position: relative; z-index: 2; padding: 20px; }
        .code { background: rgba(139,92,246,0.8); color: white; padding: 2px 8px; border-radius: 4px; font-family: monospace; font-weight: bold; font-size: 0.75rem; display: inline-block; margin-bottom: 5px; }
        .card h3 { margin: 0; font-size: 1.2rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .card p { color: #ddd; font-size: 0.85rem; margin: 2px 0; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        
        /* Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: #1a1a24; padding: 30px; border-radius: 16px; width: 450px; border: 1px solid #444; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #aaa; font-size: 0.85rem; }
        .form-control { width: 100%; padding: 10px; background: #000; border: 1px solid #333; border-radius: 8px; color: white; }
        
        .btn-save { background: #8B5CF6; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-delete { background: #ef4444; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Team Members</h1>
        <button class="btn-add" onclick="openModal()">+ Add Member</button>
    </div>
    <div class="grid" id="teamGrid"></div>

    <div class="modal" id="editModal">
        <div class="modal-content" onkeydown="handleDoubleEnter(event)">
            <h2 style="margin-bottom: 20px;" id="modalTitle">Add Team Member</h2>
            <input type="hidden" id="tId">
            <div class="form-group"><label>Name</label><input type="text" id="tName" class="form-control"></div>
            <div class="form-group"><label>Role (Admin, Tester...)</label>
                <select id="tRole" class="form-control">
                    <option value="Admin">Admin</option>
                    <option value="Manager">Manager</option>
                    <option value="Tester">Tester</option>
                    <option value="Reviewer">Reviewer</option>
                    <option value="Developer">Developer</option>
                    <option value="Support">Support</option>
                </select>
            </div>
            <div class="form-group"><label>Email</label><input type="email" id="tEmail" class="form-control"></div>
            <div class="form-group"><label>Phone</label><input type="text" id="tPhone" class="form-control"></div>
            
            <div class="form-group" style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px;">
                <label>Profile Image</label>
                <input type="file" id="tImageUpload" class="form-control" accept="image/*" onchange="uploadImage(event)" style="margin-bottom: 5px;">
                <input type="text" id="tImage" class="form-control" placeholder="Or paste URL...">
            </div>
            
            <button onclick="saveMember()" class="btn-save">Save (Or Double Enter)</button>
            <button onclick="deleteMember()" id="btnDelete" class="btn-delete">Delete Member</button>
            <button onclick="document.getElementById('editModal').classList.remove('active')" style="width: 100%; background: transparent; color: #aaa; border: none; margin-top: 10px; cursor: pointer;">Cancel</button>
        </div>
    </div>

    <script src="admin.js"></script>
    <script>
        let teamData = [];
        let enterCount = 0;
        let enterTimer;

        async function loadTeam() {
            const token = localStorage.getItem('ione_admin_token');
            const res = await fetch('/api/team/list', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            if (data.success) {
                teamData = data.team;
                const grid = document.getElementById('teamGrid');
                grid.innerHTML = teamData.length === 0 ? '<p>No team members yet.</p>' : teamData.map(m => `
                    <div class="card" onclick="editMember('${m.id}')" style="background-image: url('${m.image_url || 'https://images.unsplash.com/photo-1560250097-0b93528c311a?q=80&w=600&auto=format&fit=crop'}');">
                        <div class="card-content">
                            <div class="code">${m.code}</div>
                            <h3>${m.name}</h3>
                            <p>${m.role}</p>
                        </div>
                    </div>
                `).join('');
            }
        }

        function openModal() {
            document.getElementById('modalTitle').innerText = 'Add Team Member';
            document.getElementById('tId').value = '';
            document.getElementById('tName').value = '';
            document.getElementById('tRole').value = 'Tester';
            document.getElementById('tEmail').value = '';
            document.getElementById('tPhone').value = '';
            document.getElementById('tImage').value = '';
            document.getElementById('btnDelete').style.display = 'none';
            document.getElementById('editModal').classList.add('active');
        }

        function editMember(id) {
            const m = teamData.find(x => x.id === id);
            if(!m) return;
            document.getElementById('modalTitle').innerText = 'Edit Team Member';
            document.getElementById('tId').value = m.id;
            document.getElementById('tName').value = m.name;
            document.getElementById('tRole').value = m.role;
            document.getElementById('tEmail').value = m.email || '';
            document.getElementById('tPhone').value = m.phone || '';
            document.getElementById('tImage').value = m.image_url || '';
            document.getElementById('btnDelete').style.display = 'block';
            document.getElementById('editModal').classList.add('active');
        }

        async function uploadImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', 'ione_unsigned');
            try {
                const res = await fetch(`https://api.cloudinary.com/v1_1/xhfnelrf/image/upload`, { method: 'POST', body: formData });
                const data = await res.json();
                document.getElementById('tImage').value = data.secure_url;
            } catch(e) {}
        }

        // ميزة حفظ بـ Double Enter
        function handleDoubleEnter(e) {
            if (e.key === 'Enter') {
                enterCount++;
                clearTimeout(enterTimer);
                if (enterCount === 2) {
                    saveMember();
                    enterCount = 0;
                } else {
                    enterTimer = setTimeout(() => { enterCount = 0; }, 1000);
                }
            }
        }

        async function saveMember() {
            const token = localStorage.getItem('ione_admin_token');
            const id = document.getElementById('tId').value;
            const payload = {
                id: id || undefined,
                name: document.getElementById('tName').value,
                role: document.getElementById('tRole').value,
                email: document.getElementById('tEmail').value,
                phone: document.getElementById('tPhone').value,
                image_url: document.getElementById('tImage').value
            };
            const url = id ? '/api/team/update' : '/api/team/save';
            await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify(payload) });
            document.getElementById('editModal').classList.remove('active');
            loadTeam();
        }

        async function deleteMember() {
            if(!confirm('Are you sure?')) return;
            const token = localStorage.getItem('ione_admin_token');
            const id = document.getElementById('tId').value;
            await fetch('/api/team/delete', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ id }) });
            document.getElementById('editModal').classList.remove('active');
            loadTeam();
        }

        window.onload = loadTeam;
    </script>
</body>
</html>
