<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>IONECENTER — Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <link rel="stylesheet" href="admin.css">
    <style>
        body.login-page {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px; position: relative; overflow: hidden;
        }
        .bg-image { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('../assets/bg-login.jpg'); background-size: cover; background-position: center; z-index: -2; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(29,29,31,0.75) 0%, rgba(227,30,36,0.55) 100%); z-index: -1; backdrop-filter: blur(4px); }
        .login-container { width: 100%; max-width: 440px; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(24px); border-radius: 24px; padding: 48px 40px; box-shadow: 0 32px 80px rgba(0,0,0,0.5); position: relative; z-index: 1; text-align: center; }
        .login-logo { margin-bottom: 24px; } .login-logo img { max-width: 180px; height: auto; }
        .login-title { font-family: 'Inter', sans-serif; font-size: 1.75rem; font-weight: 700; color: #1d1d1f; margin-bottom: 4px; }
        .login-subtitle { font-size: 0.95rem; color: #6e6e73; margin-bottom: 32px; }
        .login-form { display: flex; flex-direction: column; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; text-align: right; }
        .form-group label { font-size: 0.875rem; font-weight: 600; color: #1d1d1f; }
        .input-wrapper { position: relative; }
        .input-wrapper input { width: 100%; padding: 14px 16px; border: 1.5px solid #d2d2d7; border-radius: 12px; font-family: 'Cairo', sans-serif; font-size: 1rem; color: #1d1d1f; background: white; outline: none; transition: all 0.25s ease; }
        .input-wrapper input:focus { border-color: #E31E24; box-shadow: 0 0 0 4px rgba(227, 30, 36, 0.1); }
        .input-wrapper input::placeholder { color: #a0a0a5; }
        .toggle-password { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; color: #6e6e73; padding: 8px; }
        .toggle-password:hover { color: #E31E24; } .toggle-password svg { width: 18px; height: 18px; }
        .login-btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 24px; background: #E31E24; color: white; border: none; border-radius: 12px; font-family: 'Cairo', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.25s ease; margin-top: 8px; }
        .login-btn:hover:not(:disabled) { background: #C8102E; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(227, 30, 36, 0.4); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; } .login-btn svg { width: 20px; height: 20px; }
        .form-message { text-align: center; font-size: 0.9rem; font-weight: 500; min-height: 20px; }
        .form-message.error { color: #FF3B30; } .form-message.success { color: #34C759; }
        .login-footer { text-align: center; margin-top: 32px; padding-top: 24px; border-top: 1px solid #d2d2d7; color: #6e6e73; font-size: 0.85rem; }
    </style>
</head>
<body class="login-page">
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <main class="login-container">
        <div class="login-logo"><img src="../assets/logo.png" alt="IONE CENTER"></div>
        <h1 class="login-title">Admin Panel</h1>
        <p class="login-subtitle">لوحة إدارة IONECENTER</p>

        <form class="login-form" id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" placeholder="khalilceo@ione.com" autocomplete="email" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
                    <button type="button" class="toggle-password" id="togglePassword"><i data-lucide="eye"></i></button>
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <i data-lucide="log-in"></i><span>تسجيل الدخول</span>
            </button>
            <p class="form-message" id="formMessage"></p>
        </form>
        <footer class="login-footer"><p>© 2026 IONE CENTER</p></footer>
    </main>

    <script>
        if (window.lucide) lucide.createIcons();
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const formMessage = document.getElementById('formMessage');
        const togglePassword = document.getElementById('togglePassword');

        if (togglePassword) {
            togglePassword.addEventListener('click', () => {
                const type = passwordInput.type === 'password' ? 'text' : 'password';
                passwordInput.type = type;
                const icon = togglePassword.querySelector('i');
                if (icon) {
                    icon.setAttribute('data-lucide', type === 'password' ? 'eye' : 'eye-off');
                    if (window.lucide) lucide.createIcons();
                }
            });
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;

            if (!email || !password) { showMessage('يرجى إدخال البريد وكلمة المرور', 'error'); return; }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span>جاري التحقق...</span>';
            showMessage('جاري التحقق من بياناتك...', '');

            try {
                // تم إصلاح المسار هنا إلى /api/auth/login
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const textResponse = await response.text();
                let data;
                try { data = JSON.parse(textResponse); } catch (err) {
                    showMessage('❌ خطأ في السيرفر (لم يتم استلام JSON)', 'error');
                    loginBtn.disabled = false; loginBtn.innerHTML = '<i data-lucide="log-in"></i><span>تسجيل الدخول</span>'; if (window.lucide) lucide.createIcons();
                    return;
                }

                if (!data.success) {
                    showMessage('❌ ' + (data.error || 'فشل تسجيل الدخول'), 'error');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i data-lucide="log-in"></i><span>تسجيل الدخول</span>';
                    if (window.lucide) lucide.createIcons();
                    passwordInput.value = '';
                    return;
                }

                // حفظ بيانات الجلسة والصلاحيات
                localStorage.setItem('ione_admin_token', data.token);
                localStorage.setItem('ione_admin_user', JSON.stringify(data.user));
                
                const role = data.user.role || 'user';
                const permissions = data.user.permissions || [];
                const name = data.user.full_name || data.user.username || 'مستخدم';
                const avatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=8b5cf6&color=fff`;

                localStorage.setItem('userRole', role);
                localStorage.setItem('userPermissions', JSON.stringify(permissions));
                localStorage.setItem('userName', name);
                localStorage.setItem('userAvatar', avatar);

                showMessage('✅ مرحباً ' + name, 'success');
                setTimeout(() => { window.location.replace('dashboard.html'); }, 600);

            } catch (error) {
                console.error('Login error:', error);
                showMessage('❌ خطأ في الاتصال بالسيرفر', 'error');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i data-lucide="log-in"></i><span>تسجيل الدخول</span>';
                if (window.lucide) lucide.createIcons();
            }
        });

        function showMessage(text, type) {
            if (!formMessage) return;
            formMessage.textContent = text;
            formMessage.className = 'form-message' + (type ? ' ' + type : '');
        }
        setTimeout(() => emailInput.focus(), 100);
    </script>
</body>
</html>
