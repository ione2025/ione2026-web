<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IONECENTER — Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="login-page">
    
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <main class="login-container">
        
        <div class="login-logo">
            <img src="../assets/logo.png" alt="IONE CENTER">
        </div>

        <h1 class="login-title">Admin Panel</h1>
        <p class="login-subtitle">لوحة إدارة IONECENTER</p>

        <form class="login-form" id="loginForm">
            
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <div class="input-wrapper">
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        placeholder="khalilceo@ione.com"
                        autocomplete="email"
                        required
                        style="padding-left: 16px;"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" class="toggle-password" id="togglePassword">
                        <i data-lucide="eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <i data-lucide="log-in"></i>
                <span>تسجيل الدخول</span>
            </button>

            <p class="form-message" id="formMessage"></p>

        </form>

        <footer class="login-footer">
            <p>© 2026 IONE CENTER</p>
        </footer>

    </main>

    <script src="admin.js"></script>
    <script>
        if (window.lucide) lucide.createIcons();

        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const formMessage = document.getElementById('formMessage');
        const togglePassword = document.getElementById('togglePassword');

        if (togglePassword) {
            togglePassword.addEventListener('click', () => {
                const type = passwordInput.type === 'password' ? 'text' : 'password';
                passwordInput.type = type;
                const icon = togglePassword.querySelector('i');
                if (icon) {
                    icon.setAttribute('data-lucide', type === 'password' ? 'eye' : 'eye-off');
                    if (window.lucide) lucide.createIcons();
                }
            });
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showMessage('يرجى إدخال البريد وكلمة المرور', 'error');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span>جاري التحقق...</span>';
            showMessage('جاري التحقق من بياناتك...', '');

            try {
                const response = await fetch('https://ionecenter.com/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!data.success) {
                    showMessage('❌ ' + (data.error || 'فشل تسجيل الدخول'), 'error');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i data-lucide="log-in"></i><span>تسجيل الدخول</span>';
                    if (window.lucide) lucide.createIcons();
                    passwordInput.value = '';
                    return;
                }

                saveSession(data.token, data.user);
                showMessage('✅ مرحباً ' + (data.user.full_name || data.user.username), 'success');

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);

            } catch (error) {
                console.error('Login error:', error);
                showMessage('❌ خطأ في الاتصال بالسيرفر', 'error');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i data-lucide="log-in"></i><span>تسجيل الدخول</span>';
                if (window.lucide) lucide.createIcons();
            }
        });

        function showMessage(text, type) {
            if (!formMessage) return;
            formMessage.textContent = text;
            formMessage.className = 'form-message' + (type ? ' ' + type : '');
        }

        emailInput.focus();
    </script>
</body>
</html>
